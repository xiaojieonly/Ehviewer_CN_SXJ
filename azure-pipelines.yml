# Android
# Build your Android project with Gradle.
# Add steps that test, sign, and distribute the APK, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/android

trigger:
- BiLi_PC_Gamer

jobs:
- job: android_build
  displayName: Build & test Android
  pool:
    vmImage: 'macos-latest'
  steps:
  - task: Gradle@2
    inputs:
      workingDirectory: ''
      gradleWrapperFile: 'gradlew'
      gradleOptions: '-Xmx3072m'
      publishJUnitResults: true
      testResultsFiles: '**/TEST-*.xml'
      # MASTER-2026-08-22 B2：assembleDebug 之外接入单测门（Robolectric 全量）。
      tasks: 'assembleDebug testAppReleaseDebugUnitTest'

  - task: AndroidSigning@2
    inputs:
      # 修正：assembleDebug 产物路径（原指向不存在的 build/Anotherviewer.apk）。
      apkFiles: 'app/build/outputs/apk/debug/app-debug.apk'
      jarsign: true
      jarsignerKeystoreFile: 'text.key'
      # Secrets: configure as secret pipeline variables (library/UI) — never hardcode in repo.
      jarsignerKeystorePassword: '$(ANDROID_JARSIGNER_KEYSTORE_PASSWORD)'
      jarsignerKeystoreAlias: '$(ANDROID_JARSIGNER_KEYSTORE_ALIAS)'
      jarsignerKeyPassword: '$(ANDROID_JARSIGNER_KEY_PASSWORD)'
      zipalign: true

- job: web_build
  displayName: Build & publish web backend
  pool:
    vmImage: 'macos-latest'
  steps:
  # macOS-15 (macos-latest) image ships JDK 21 (default) + Android SDK with
  # platform android-35 / build-tools 35.0.0 (matches app/build.gradle compileSdk 35).
  # The root build.gradle applies AGP (apply false) and :app applies it, so Gradle
  # configures :app even for :anotherviewer-web:bootJar and needs ANDROID_HOME present —
  # it is, preinstalled on the image, so no AndroidSDK@1 step is required.
  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'
    displayName: Use JDK 21

  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: Use Node.js 22

  - task: Cache@2
    inputs:
      key: 'gradle | "$(Agent.OS)" | gradle/wrapper/gradle-wrapper.properties'
      path: |
        $(GRADLE_USER_HOME)/caches
        $(GRADLE_USER_HOME)/wrapper/dists
    displayName: Cache Gradle wrapper and dependencies

  - task: Npm@1
    inputs:
      command: ci
      workingDir: 'web-frontend'
    displayName: npm ci (web-frontend)

  # MASTER-2026-08-22 B2：前端质量门（类型 + 单测）。
  - script: |
      npm run typecheck
      npx vitest run
    workingDirectory: 'web-frontend'
    displayName: Frontend typecheck & vitest

  - script: npx vite build
    workingDirectory: 'web-frontend'
    displayName: Vite build (frontend)

  - task: Gradle@2
    inputs:
      gradleWorkingDirectory: ''
      gradleWrapperFile: 'gradlew'
      gradleOptions: '-Xmx3072m'
      publishJUnitResults: true
      testResultsFiles: '**/TEST-*.xml'
      # B2：bootJar 之外接入 JVM 双门（core 解析器 + web 全量）。
      tasks: ':anotherviewer-core:test :anotherviewer-web:test :anotherviewer-web:bootJar'
    displayName: Gradle core/web tests + bootJar

  - task: PublishBuildArtifact@1
    inputs:
      pathToPublish: 'anotherviewer-web/build/libs/'
      artifactName: 'web-backend'
      artifactType: 'container'
    displayName: Publish web-backend artifact
