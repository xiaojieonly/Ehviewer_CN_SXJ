# Gitleaks 白名单：排除已知的测试夹具/常量误报。
# 真泄露（anotherviewer-web/data/*.db 的 admin 哈希）已通过 git filter-repo
# 按路径从全历史剔除，gitleaks 无法命中二进制 SQLite，由路径剔除保证。

[allowlist]
  description = "已知测试夹具与配置常量（误报）"
  regexes = [
    # 必须锚定完整值（收尾引号）：只豁免 16 位 hex 夹具常量本身，
    # 不得让「以该前缀开头的真实 token」也被白名单覆盖。
    '''token\s*=\s*"0123456789abcdef"|token\s*=\s*'0123456789abcdef''',
    '''TOKEN\s*=\s*'0123456789abcdef''',
    '''KEY_DEFAULT_FAV_SLOT\s*=\s*"default_favorite_2"''',
  ]
