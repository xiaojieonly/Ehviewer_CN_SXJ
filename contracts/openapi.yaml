          additionalProperties:
            $ref: '#/components/schemas/MetricValue'
          description: Legacy per-metric map, retained for backward compatibility

    MetricValue:
      type: object
      properties:
        type:
          type: string
          enum: [gauge, counter, timer]
        value:
          nullable: true
        count:
          type: integer
          format: int64
          nullable: true
        totalMs:
          type: integer
          format: int64
          nullable: true
        meanMs:
          type: number
          format: double
          nullable: true
        maxMs:
          type: integer
          format: int64
          nullable: true

    DashboardResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/DashboardSummary'
        cache:
          $ref: '#/components/schemas/DashboardCache'
        downloads:
          $ref: '#/components/schemas/DashboardDownloads'
        processing:
          $ref: '#/components/schemas/DashboardProcessing'
        websocket:
          $ref: '#/components/schemas/DashboardWebSocket'

    DashboardSummary:
      type: object
      properties:
        status:
          type: string
        uptime:
          type: string
        version:
          type: string

    DashboardCache:
      type: object
      properties:
        memoryEntries:
          type: integer
        memoryUsedBytes:
          type: integer
          format: int64
        memoryMaxBytes:
          type: integer
          format: int64
        memoryUsagePercent:
          type: number
          format: double
        diskUsedBytes:
          type: integer
          format: int64
        diskMaxBytes:
          type: integer
          format: int64
        diskUsagePercent:
          type: number
          format: double
        hitRatio:
          type: number
          format: double

    DashboardDownloads:
      type: object
      properties:
        active:
          type: integer
        completedTotal:
          type: integer
          format: int64
        failedTotal:
          type: integer
          format: int64
        activeTasks:
          type: array
          items:
            $ref: '#/components/schemas/DashboardDownloadTask'

    DashboardDownloadTask:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
        galleryId:
          type: integer
          format: int64
        galleryTitle:
          type: string
          nullable: true
        state:
          type: string
          description: "pending, starting, downloading, completed, failed"
        progress:
          type: number
          format: double
        downloadedPages:
          type: integer
        totalPages:
          type: integer

    DashboardProcessing:
      type: object
      properties:
        queueSize:
          type: integer
        completedTotal:
          type: integer
          format: int64
        processorAvailable:
          type: boolean

    DashboardWebSocket:
      type: object
      properties:
        activeConnections:
          type: integer

    # ----------------------------------------------------------
    # Preferences (per-user UI preferences)
    # ----------------------------------------------------------
    PreferenceResponse:
      type: object
      properties:
        general:
          $ref: '#/components/schemas/GeneralPreferences'
        reader:
          $ref: '#/components/schemas/ReaderPreferences'
        privacy:
          $ref: '#/components/schemas/PrivacyPreferences'

    PreferenceUpdateRequest:
      type: object
      description: All fields optional — deep-merged over the stored preferences
      properties:
        general:
          $ref: '#/components/schemas/GeneralPreferences'
        reader:
          $ref: '#/components/schemas/ReaderPreferences'
        privacy:
          $ref: '#/components/schemas/PrivacyPreferences'

    GeneralPreferences:
      type: object
      properties:
        theme:
          type: string
          default: light
        themeAutoSwitch:
          type: boolean
          default: false
        launchPage:
          type: string
          default: homepage
        listMode:
          type: string
          enum: [grid, list]
          default: grid
        showUploader:
          type: boolean
          default: false
        showPostedTime:
          type: boolean
          default: false
        defaultFavoriteSlot:
          type: integer
          minimum: -2
          maximum: 9
          default: 0
        favoriteSlotNames:
          type: string
          description: Ten pipe-separated slot names; empty items fall back to defaults
          default: ""
        recentSearchMax:
          type: integer
          minimum: 0
          default: 10
        showReadProgress:
          type: boolean
          default: true
        detailSize:
          type: string
          default: long
        thumbSize:
          type: string
          default: middle
        historyInfoSize:
          type: integer
          default: 100
        showJpnTitle:
          type: boolean
          default: false
        showGalleryPages:
          type: boolean
          default: false
        showTagTranslations:
          type: boolean
          default: true
        showGalleryComment:
          type: boolean
          default: true
        showGalleryRating:
          type: boolean
          default: true
        showSiteEvents:
          type: boolean
          default: true
        showSiteLimits:
          type: boolean
          default: true

    ReaderPreferences:
      type: object
      properties:
        readingDirection:
          type: string
          default: rtl
        pageMode:
          type: string
          default: dual
        firstPageCover:
          type: boolean
          default: true
        pageScaling:
          type: string
          default: fit
        startPosition:
          type: string
          default: top_right
        autoPlayIntervalSec:
          type: integer
          default: 2
        showProgress:
          type: boolean
          default: true
        showPageInterval:
          type: boolean
          default: true
        fullscreen:
          type: boolean
          default: true
        brightness:
          type: integer
          default: 0
        backgroundColor:
          type: string
          enum: [black, gray, white]
          default: black
        tapZoneScheme:
          type: string
          enum: [threeZone, edgeOnly, disabled]
          default: threeZone
        keyboardPaging:
          type: boolean
          default: true
        zoomStep:
          type: number
          exclusiveMinimum: 1
          default: 1.5
        maxZoom:
          type: number
          minimum: 1
          default: 5
        dualPageGap:
          type: integer
          minimum: 0
          default: 8
        splitWidePages:
          type: boolean
          default: false
        preloadCount:
          type: integer
          minimum: 0
          default: 2
        pageTransition:
          type: string
          enum: [slide, fade, none]
          default: slide

    PrivacyPreferences:
      type: object
      properties:
        enableAnalytics:
          type: boolean
          default: true

    # ----------------------------------------------------------
    # Common
    # ----------------------------------------------------------
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          default: false
        message:
          type: string
