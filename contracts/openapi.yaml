      responses:
        '200':
          description: Always true
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/download/restart-all:
    post:
      tags: [Download]
      operationId: restartAllDownloads
      summary: Restart every download task, skipping rows that pass on-disk verification
      description: |
        WebUI "Restart all"（全部下载）. Ignores the current state (including
        FINISHED=3, FAILED=4, PAUSED=0) of every row and restarts it. Before
        iterating, the on-disk download directory index is force-refreshed, so
        pages just copied/uploaded into downloads/<gid>/ are picked up without
        a server restart. A row whose local content directory already holds a
        complete set of page files (count >= total, total>0) is marked
        FINISHED (state=3, done=total, error cleared) and skipped with zero
        network I/O; every other row goes through the normal download
        pipeline. Disk-only directories never get DB rows created for them.
      responses:
        '200':
          description: Always true (the restart runs server-side; counts are logged only)
          content:
            application/json:
              schema:
                type: boolean

