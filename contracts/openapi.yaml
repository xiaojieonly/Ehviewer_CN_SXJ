    # ----------------------------------------------------------
    # Sync
    # ----------------------------------------------------------
    SyncPushRequest:
      type: object
      required: [entities, deviceId, timestamp]
      properties:
        entities:
          $ref: '#/components/schemas/SyncEntityCollection'
        deviceId:
          type: string
          description: ID of the client device performing the push
        timestamp:
          type: integer
          format: int64
          description: Client's current timestamp (ms epoch) for conflict resolution
        policy:
          allOf:
            - $ref: '#/components/schemas/SyncPolicy'
          description: Optional (v2). Authoritative when the pushing device is android-platform (ADR-0003 D2); web-originated pushes must not carry it.

    SyncPushResponse:
      type: object
      required: [success, serverTimestamp]
      properties:
        success:
          type: boolean
        serverTimestamp:
          type: integer
          format: int64
          description: Server timestamp after applying changes (use as the base for the next pull)
        conflicts:
          type: integer
          description: Number of conflicts resolved (last-write-wins)

    SyncPullResponse:
      type: object
      required: [entities, serverTimestamp]
      properties:
        entities:
          $ref: '#/components/schemas/SyncEntityCollection'
        serverTimestamp:
          type: integer
          format: int64
          description: Current server timestamp (use as 'since' for the next pull)
        policy:
          allOf:
            - $ref: '#/components/schemas/SyncPolicy'
          description: Optional (v2). Current server sync policy; absent on legacy servers → client falls back to lww without error.

    SyncPolicy:
      type: object
      required: [conflictStrategy, clientTier, autoSyncIntervalSec]
      properties:
        conflictStrategy:
          type: string
          enum: [device_priority, lww, web_priority]
          default: device_priority
          description: >-
            Conflict arbitration strategy (sync-conflict-rules v2 §1.4):
            device_priority = android wins cross-platform same-key conflicts;
            lww = v1 last-write-wins + skew tie-break (full fallback);
            web_priority = web wins.
        clientTier:
          type: integer
          enum: [0, 1, 2, 3]
          default: 1
          description: "Client behavior tier (D3): 0 independent, 1 sync+streaming, 2 browsing proxied via server, 3 download hosting (deferred)"
        autoSyncIntervalSec:
          type: integer
          minimum: 0
          default: 900
          description: Network-aware auto-sync interval (D4); 0 = trigger on network change only

    BackupRestoreResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
          description: Human-readable result note (e.g. 还原成功，重启后生效)

