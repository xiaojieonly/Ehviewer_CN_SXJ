  # ============================================================
  # Settings
  # ============================================================
  /api/v1/settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Get current server settings
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
    put:
      tags: [Settings]
      operationId: updateSettings
      summary: Update server settings (partial update supported)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateRequest'
      responses:
        '200':
          description: Whether the update succeeded
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/proxy/test:
    post:
      tags: [Settings]
      operationId: testProxy
      summary: Test connectivity to Gallery Site through a proxy (saved settings when no body)
      description: |
        With no body the currently saved proxy settings are used; with a body
        the given values are tested (all fields optional, merged over the
        saved settings), so the admin UI can validate a form before saving it.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyTestRequest'
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyTestResponse'

  /api/v1/site/proxy:
    get:
      tags: [Gallery]
      operationId: proxySite
      summary: Transparent Gallery Site proxy for App Tier-2 browsing (W3 R4-13)
      description: |
        Fetches `url` through the server's shared site session (cookies/proxy
        inherited) and passes status, content-type and body straight through.
        The host must be e-hentai.org, exhentai.org, ehgt.org, or a
        subdomain of these — anything else is rejected, so the endpoint is not
        an open proxy. An unreachable site
        surfaces 502 (E2E-6: errors are passed through, never fabricated).
        App Tier-2 routing rewrites site-family requests here (ADR-0003 D3).
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: Absolute Gallery Site URL to fetch (host-whitelisted)
      responses:
        '200':
          description: Site response passed through (content-type and body preserved)
          content:
            text/html:
              schema:
                type: string
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: url missing/malformed or host outside the Gallery Site whitelist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Gallery Site unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # Preferences (per-user UI preferences)
  # ============================================================
  /api/v1/preferences:
    get:
      tags: [Settings]
      operationId: getPreferences
      summary: Get the authenticated user's UI preferences
      responses:
        '200':
          description: Current preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceResponse'
        '401':
          description: Authentication required
    put:
      tags: [Settings]
      operationId: updatePreferences
      summary: Update the authenticated user's UI preferences (deep merge, all fields optional)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenceUpdateRequest'
      responses:
        '200':
          description: Merged preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceResponse'
        '401':
          description: Authentication required

  # ============================================================
  # Image (existing proxy + new streaming)
  # ============================================================
  /api/v1/image/proxy:
    get:
      tags: [Image]
      operationId: proxyImage
      summary: Proxy and cache an image by its original URL (W3 R4-13 fetch-on-miss)
      description: |
        URL-keyed cache lookup. On a miss for a Gallery Site URL
        (e-hentai.org / exhentai.org / ehgt.org family) the image is fetched
        through the server's shared site session (cookies/proxy inherited), backfilled
        into the cache and served with the site's content-type. Non-site
        hosts are never fetched; an unreachable or erroring site keeps the
        404 error envelope (E2E-6: errors pass through, never fabricated).
        Backs the Tier-2 thumbnail rewrite (W3 #13).
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: Original image URL to proxy
      responses:
        '200':
          description: Image binary data (cache hit, or fetch-on-miss with the site content-type)
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Not in cache and not fetchable (non-whitelisted host, site unreachable, or site error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/image/cache/status:
    get:
      tags: [Image]
      operationId: getImageCacheStatus
      summary: Get image cache size information
      responses:
        '200':
          description: Cache status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageCacheStatus'

  /api/v1/image/cache/clear:
    post:
      tags: [Image]
      operationId: clearImageCache
      summary: Clear all cached proxy images asynchronously (CACHE_CLEAR job)
      description: |
        Submits a CACHE_CLEAR background job (202); progress is pushed on
        /topic/jobs/{jobId} and /topic/jobs/all (A3) and the terminal result is
        {removed, total}.
      responses:
        '202':
          description: Cache-clear job submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '409':
          description: 'Another CACHE_CLEAR job is already active (code=CONFLICT)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/image/{galleryId}/{page}:
    get:
      tags: [Image]
      operationId: streamGalleryImage
      summary: Stream a single gallery page image with on-demand fetching and caching
      description: |
        Returns the image for a specific page of a gallery. On cache miss, the server
        fetches the image via the core parser, caches it, and returns it.
        Supports HTTP Range requests for partial content (206) and unsatisfiable
        ranges (416). When `enhanced=1` is set, the AI-enhanced variant is served
        from the processing output directory if it exists (404 otherwise).
      parameters:
        - name: galleryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Gallery ID
        - name: page
          in: path
          required: true
          schema:
            type: integer
            format: int32
          description: Page number (0-based)
        - name: w
          in: query
          required: false
          schema:
            type: integer
            format: int32
          description: |
            Accepted for client compatibility; currently ignored by the server
            (the original resolution is always returned).
        - name: enhanced
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
            default: 0
          description: If 1, return the AI-enhanced version (if processed); otherwise return original
        - name: Range
          in: header
          required: false
          schema:
            type: string
          description: HTTP Range header for partial content (e.g. "bytes=0-1023")
      responses:
        '200':
          description: Full image
          headers:
            Content-Type:
              schema:
                type: string
              description: MIME type of the image (image/jpeg, image/png, image/webp, image/gif)
            Accept-Ranges:
              schema:
                type: string
              description: "Always 'bytes'"
            Cache-Control:
              schema:
                type: string
              description: "max-age=86400"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content (Range request)
          headers:
            Content-Range:
              schema:
                type: string
              description: "Range specifier (e.g. 'bytes 0-1023/4096')"
            Content-Type:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
              description: "Always 'bytes'"
            Cache-Control:
              schema:
                type: string
              description: "max-age=86400"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '401':
          description: Gallery Site session expired or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '404':
          description: Gallery or page not found (or enhanced variant not processed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageErrorResponse'
        '416':
          description: Range not satisfiable
          headers:
            Content-Range:
              schema:
                type: string
              description: "bytes */<size>"
        '429':
          description: Rate limited (concurrent fetch limit for this gallery reached)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageErrorResponse'

