      type: object
      description: A single EH session cookie (mirrors okhttp3.Cookie / SiteCookieStore).
      properties:
        name:
          type: string
        value:
          type: string
          description: "Cookie value; encrypted at rest on the server (enc:v1: + security.key, ADR-0004 D4)"
        domain:
          type: string
        path:
          type: string
        expiresAt:
          type: integer
          format: int64
          description: Cookie expiry as epoch ms; 0 = session cookie
        secure:
          type: boolean
          description: Whether the cookie is restricted to HTTPS
        httpOnly:
          type: boolean
          description: Whether the cookie is HTTP-only
        persistent:
          type: boolean
          description: Whether the cookie persists across sessions (false = session cookie)
        hostOnly:
          type: boolean
          description: Whether the cookie applies only to its exact host domain

