      properties:
        cookies:
          type: array
          items:
            $ref: '#/components/schemas/SyncEhSessionCookieDto'
          description: EH session cookies, full identity fields; only gallery-site domains (e-hentai.org / exhentai.org / ehgt.org / forums.e-hentai.org and subdomains) are accepted
        displayName:
          type: string
          nullable: true
          description: EH member display name
        avatar:
          type: string
          nullable: true
          description: EH member avatar image URL
        gallerySite:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1
          description: Gallery site selection (0 = e-hentai.org, 1 = exhentai.org); absent or null = keep receiving side's current selection
        lastModified:
          type: integer
          format: int64
          description: Epoch ms when the session was last modified on the source device (LWW)
        deviceId:
          type: string
          description: Device that last modified this session
        deleted:
          type: boolean
          description: Tombstone flag — true = logged out / cookies cleared on the originating device (ADR-0004 D3); propagates under every strategy

