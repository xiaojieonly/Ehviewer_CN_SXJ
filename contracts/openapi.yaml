            type: string
          nullable: true
          description: Structured key/value details (e.g. type, reason, freeSpace, path, responseTimeMs)

    AvailabilityStatus:
      type: object
      description: >-
        Gallery Site availability state machine (plan 2026-08-30): DOWN =
        circuit-broken (automatic upstream requests short-circuited with 404
        EH_UNAVAILABLE, no network I/O); UP = reachable after a successful
        probe; UNKNOWN = no probe since startup (requests treated as UP,
        failures transition to DOWN). Process-local runtime state; never
        persisted and never synced (ADR-0001).
      properties:
        state:
          type: string
          enum: [UP, DOWN, UNKNOWN]
        downAt:
          type: integer
          format: int64
          nullable: true
          description: Epoch milliseconds of the DOWN transition; null unless state=DOWN
        lastReason:
          type: string
          nullable: true
          description: Last failure reason (e.g. timeout, connection refused, HTTP 5xx); null if never failed
        lastProbeAt:
          type: integer
          format: int64
          nullable: true
          description: Epoch milliseconds of the last probe attempt; null before the first probe

    MetricsResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
          format: int64
        jvmMemoryUsedBytes:
          type: integer
          format: int64
        jvmMemoryMaxBytes:
          type: integer
          format: int64
        activeDownloads:
          type: integer
        queuedProcessingTasks:
          type: integer
        diskCacheUsedBytes:
          type: integer
          format: int64
        diskCacheMaxBytes:
          type: integer
          format: int64
        totalGalleriesServed:
          type: integer
          format: int64
        metrics:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MetricValue'
          description: Legacy per-metric map, retained for backward compatibility

    MetricValue:
      type: object
      properties:
        type:
          type: string
          enum: [gauge, counter, timer]
        value:
          nullable: true
        count:
          type: integer
          format: int64
          nullable: true
        totalMs:
          type: integer
          format: int64
          nullable: true
        meanMs:
          type: number
          format: double
          nullable: true
        maxMs:
          type: integer
          format: int64
          nullable: true

    DashboardResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/DashboardSummary'
        cache:
          $ref: '#/components/schemas/DashboardCache'
        downloads:
          $ref: '#/components/schemas/DashboardDownloads'
        processing:
          $ref: '#/components/schemas/DashboardProcessing'
        websocket:
          $ref: '#/components/schemas/DashboardWebSocket'

    DashboardSummary:
      type: object
      properties:
        status:
          type: string
        uptime:
          type: string
        version:
          type: string

    DashboardCache:
      type: object
      properties:
        memoryEntries:
          type: integer
        memoryUsedBytes:
          type: integer
          format: int64
        memoryMaxBytes:
          type: integer
          format: int64
        memoryUsagePercent:
          type: number
          format: double
        diskUsedBytes:
          type: integer
          format: int64
        diskMaxBytes:
          type: integer
          format: int64
        diskUsagePercent:
          type: number
          format: double
        hitRatio:
          type: number
          format: double

    DashboardDownloads:
      type: object
      properties:
        active:
          type: integer
        completedTotal:
          type: integer
          format: int64
        failedTotal:
          type: integer
          format: int64
        activeTasks:
          type: array
          items:
            $ref: '#/components/schemas/DashboardDownloadTask'

    DashboardDownloadTask:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
        galleryId:
          type: integer
          format: int64
        galleryTitle:
          type: string
          nullable: true
        state:
          type: string
          description: "pending, starting, downloading, completed, failed"
        progress:
          type: number
          format: double
        downloadedPages:
          type: integer
        totalPages:
          type: integer

    DashboardProcessing:
      type: object
      properties:
        queueSize:
          type: integer
        completedTotal:
          type: integer
          format: int64
        processorAvailable:
          type: boolean

    DashboardWebSocket:
      type: object
      properties:
        activeConnections:
          type: integer

    # ----------------------------------------------------------
    # Preferences (per-user UI preferences)
    # ----------------------------------------------------------
    PreferenceResponse:
      type: object
      properties:
        general:
          $ref: '#/components/schemas/GeneralPreferences'
        reader:
          $ref: '#/components/schemas/ReaderPreferences'
        privacy:
          $ref: '#/components/schemas/PrivacyPreferences'

    PreferenceUpdateRequest:
      type: object
      description: All fields optional — deep-merged over the stored preferences
      properties:
        general:
          $ref: '#/components/schemas/GeneralPreferences'
        reader:
          $ref: '#/components/schemas/ReaderPreferences'
        privacy:
          $ref: '#/components/schemas/PrivacyPreferences'

    GeneralPreferences:
      type: object
      properties:
        theme:
          type: string
          default: light
        themeAutoSwitch:
          type: boolean
          default: false
        launchPage:
          type: string
          default: homepage
        listMode:
          type: string
          enum: [grid, list]
          default: grid
        showUploader:
          type: boolean
          default: false
        showPostedTime:
          type: boolean
          default: false
        defaultFavoriteSlot:
          type: integer
          minimum: -2
          maximum: 9
          default: 0
        favoriteSlotNames:
          type: string
          description: Ten pipe-separated slot names; empty items fall back to defaults
          default: ""
        recentSearchMax:
          type: integer
          minimum: 0
          default: 10
        showReadProgress:
          type: boolean
          default: true
        detailSize:
          type: string
          default: long
        thumbSize:
          type: string
          default: middle
        historyInfoSize:
          type: integer
          default: 100
        showJpnTitle:
          type: boolean
          default: false
        showGalleryPages:
          type: boolean
          default: false
        showTagTranslations:
          type: boolean
          default: true
        showGalleryComment:
          type: boolean
          default: true
        showGalleryRating:
          type: boolean
          default: true
        showEhEvents:
          type: boolean
          default: true
        showEhLimits:
          type: boolean
          default: true

    ReaderPreferences:
      type: object
      properties:
        readingDirection:
          type: string
          default: rtl
        pageMode:
          type: string
          default: dual
        firstPageCover:
          type: boolean
          default: true
        pageScaling:
          type: string
          default: fit
        startPosition:
          type: string
          default: top_right
        autoPlayIntervalSec:
          type: integer
          default: 2
        showProgress:
          type: boolean
          default: true
        showPageInterval:
          type: boolean
          default: true
        fullscreen:
          type: boolean
          default: true
        brightness:
          type: integer
          default: 0
        backgroundColor:
          type: string
          enum: [black, gray, white]
          default: black
        tapZoneScheme:
          type: string
          enum: [threeZone, edgeOnly, disabled]
          default: threeZone
        keyboardPaging:
          type: boolean
          default: true
        zoomStep:
          type: number
          exclusiveMinimum: 1
          default: 1.5
        maxZoom:
          type: number
          minimum: 1
          default: 5
        dualPageGap:
          type: integer
          minimum: 0
          default: 8
        splitWidePages:
          type: boolean
          default: false
        preloadCount:
          type: integer
          minimum: 0
          default: 2
        pageTransition:
          type: string
          enum: [slide, fade, none]
          default: slide

    PrivacyPreferences:
      type: object
      properties:
        enableAnalytics:
          type: boolean
          default: true
        privacyMask:
          type: boolean
          default: false
          description: >-
            Content-mask mode sync projection. The authoritative state lives in
            the server config (WebUI panel /privacy/mask, consumed by
            PrivacyMaskFilter): GET /preferences and sync/pull project it live,
            and an App sync/push carrying the field writes it through. Pushes
            from App versions without the field never touch the switch.

    PrivacyMaskRequest:
      type: object
      description: POST /privacy/mask body; `enabled` falls back to false when omitted
      properties:
        enabled:
          type: boolean
          default: false
          description: true = content-mask responses on, false = off

    PrivacyMaskResponse:
      type: object
      description: Current content-mask switch state (GET echo / POST result)
      properties:
        enabled:
          type: boolean

    # ----------------------------------------------------------
    # Integrity
    # ----------------------------------------------------------
    IntegrityHashEntry:
      type: object
      required: [page, ext, size, hash]
      description: One page-hash entry pushed by the App (peer evidence only)
      properties:
        page:
          type: integer
          minimum: 1
          description: 1-based page number
        ext:
          type: string
          description: Page file extension without the dot (jpg/jpeg/png/gif/webp)
        size:
          type: integer
          format: int64
          description: File size in bytes as hashed by the App
        hash:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: SHA-256 digest of the page file (64 hex characters)
        algo:
          type: string
          enum: [SHA-256]
          default: SHA-256
          description: Hash algorithm; only SHA-256 is defined

    IntegrityHashAcceptResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: integer
          description: Number of entries stored as peer evidence (0 for an empty list)

    RepairResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healed, failed]
          description: healed = file overwritten and baseline refreshed (origin=heal); failed = local file untouched
        attribution:
          type: string
          enum: [local_corrupt, source_changed]
          nullable: true
          description: >-
            Diagnostic only (log semantics): local_corrupt = the fresh source
            copy differs from the corrupt local file; source_changed = the
            source itself changed vs the baseline. null when status=healed or
            the cause is undetermined.
        message:
          type: string
          nullable: true
          description: Human-readable detail when status=failed

    ReverifyRequest:
      type: object
      properties:
        interrupt:
          type: boolean
          default: false
          description: >-
            true = set the cooperative stop flag on the active REVERIFY job
            (finishes the current page, completes with partial stats);
            false/absent = submit a new REVERIFY job for the gallery.

    ReverifyStats:
      type: object
      required: [total, ok, bad]
      description: Terminal result of a REVERIFY job (JobDto.result)
      properties:
        total:
          type: integer
          description: Pages found for the gallery at run start
        ok:
          type: integer
          description: Pages whose on-disk hash matched the baseline
        bad:
          type: integer
          description: Pages missing, unreadable or hash-mismatched
        refreshed:
          type: integer
          nullable: true
          description: Pages whose baseline was refreshed with origin=heal during the run; null when the run performed no healing
        interrupted:
          type: boolean
          default: false
          description: true when the run stopped early via the interrupt flag (counts cover processed pages only)

    IntegrityScrubRunDto:
      type: object
      description: Summary of the most recent scrub run
      properties:
        startedAt:
          type: integer
          format: int64
          description: Run start (ms epoch)
        finishedAt:
          type: integer
          format: int64
          nullable: true
          description: Run end (ms epoch); null while the run is still going
        totalPages:
          type: integer
          description: Page files examined by the run
        badPages:
          type: integer
          description: Pages the run flagged bad
        divergences:
          type: integer
          description: Baseline-vs-peer hash divergences the run found
        oneSided:
          type: integer
          default: 0
          description: >-
            Pages carrying evidence on only one side (a baseline without peer
            evidence or peer evidence without a baseline). Contract-extra
            additive field: the task brief requires the one-sided count in the
            report, so it rides on the last-run summary instead of the
            IntegrityReport top level (clients not knowing it simply ignore
            it).

    IntegrityBadPageDto:
      type: object
      description: One bad-page entry of the latest scrub run
      properties:
        gid:
          type: integer
          format: int64
        page:
          type: integer
          description: 1-based page number
        verdict:
          type: string
          enum: [MISSING, MISMATCH, READ_ERROR]
          description: MISSING = no file on disk; MISMATCH = hash differs from baseline; READ_ERROR = file present but unreadable
        size:
          type: integer
          format: int64
          nullable: true
          description: On-disk file size in bytes; null when the file is missing
        hashShort:
          type: string
          nullable: true
          description: Short digest for display (first 12 hex characters of the computed hash); null when the file is missing or unreadable

    IntegrityDivergenceDto:
      type: object
      description: One baseline-vs-peer hash divergence
      properties:
        gid:
          type: integer
          format: int64
        page:
          type: integer
          description: 1-based page number
        localHash:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: Server baseline hash (page_file_hash)
        peerHash:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: Peer (App) hash (peer_hash)

    IntegrityReport:
      type: object
      description: Latest integrity report (GET /api/v1/integrity/report)
      properties:
        lastRun:
          description: Most recent scrub run; null when no scrub has run yet
          $ref: '#/components/schemas/IntegrityScrubRunDto'
        badPages:
          type: array
          description: Paged slice of the bad-page list
          items:
            $ref: '#/components/schemas/IntegrityBadPageDto'
        badPageTotal:
          type: integer
          description: Unfiltered size of the bad-page list
        divergences:
          type: array
          description: Paged slice of the baseline-vs-peer divergence list
          items:
            $ref: '#/components/schemas/IntegrityDivergenceDto'
        divergenceTotal:
          type: integer
          description: Unfiltered size of the divergence list

    IntegrityScrubTriggerResponse:
      type: object
      description: POST /api/v1/integrity/scrub response
      required: [accepted]
      properties:
        accepted:
          type: boolean
          description: true = the scrub was enqueued on the background thread

    IntegrityBackfillRequest:
      type: object
      description: POST /api/v1/integrity/backfill body (synchronous single-gallery maintenance action)
      required: [kind, gid]
      properties:
        kind:
          type: string
          enum: [hashes, pageCounts]
          description: >-
            hashes = TOFU hash backfill (V-gate + SHA-256 baseline rows,
            origin=import, existing rows never overwritten); pageCounts =
            disk page-count backfill into download_info.pages (plus legacy
            WAIT-row completion)
        gid:
          type: integer
          format: int64
          description: Gallery ID to operate on; mandatory so the request thread never runs a full-library scan
        dryRun:
          type: boolean
          default: false
          description: true = count what would change without writing any rows or checkpoint KV

    IntegrityStructBadPage:
      type: object
      description: One page file rejected by the V gate during the backfill
      properties:
        gid:
          type: integer
          format: int64
        page:
          type: integer
          description: 0-based page number (page_file_hash.page alignment)
        fileName:
          type: string
          description: Page file name on disk (4- or 8-digit number + extension)
        reason:
          type: string
          enum: [V1_MAGIC, V2_TAIL]
          description: V-gate rejection reason

    IntegrityBackfillStats:
      type: object
      description: Result of kind="hashes" (TOFU baseline backfill)
      required: [gids, scanned, accepted, rejected, skipped, ioErrors, rejectedPages, resumedFromCheckpoint, dryRun]
      properties:
        gids:
          type: integer
          description: Galleries actually reached on disk during the run
        scanned:
          type: integer
          description: Page files really read and V-gated this run (checkpoint-skipped files not counted)
        accepted:
          type: integer
          description: Files passing the V gate (including those skipped for having a baseline already)
        rejected:
          type: integer
          description: Files rejected by the V gate (struct_bad)
        skipped:
          type: integer
          description: Files passing the gate whose (gid,page) row already exists (TOFU never overwrites)
        ioErrors:
          type: integer
          description: Files failing to read (no V-gate verdict; not counted in rejected)
        rejectedPages:
          type: array
          description: Rejection details in scan order
          items:
            $ref: '#/components/schemas/IntegrityStructBadPage'
        resumedFromCheckpoint:
          type: boolean
          description: true when the run consumed an interrupt checkpoint
        dryRun:
          type: boolean
          description: Echo of the request

    IntegrityApplyPageCountsStats:
      type: object
      description: Result of kind="pageCounts" (disk page-count backfill)
      required: [gids, rowsExamined, rowsPagesUpdated, rowsCompleted, dryRun]
      properties:
        gids:
          type: integer
          description: Distinct galleries among the examined download rows
        rowsExamined:
          type: integer
          description: Live download rows examined
        rowsPagesUpdated:
          type: integer
          description: >-
            Rows whose pages field disagreed with the disk page count (dryRun
            reports would-update counts)
        rowsCompleted:
          type: integer
          description: >-
            Legacy state=WAIT rows with total=0 completed from the disk page
            count (state=3, total=done=disk count); dryRun reports would-update
            counts
        dryRun:
          type: boolean
          description: Echo of the request

    # ----------------------------------------------------------
    # Common
    # ----------------------------------------------------------
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          default: false
        message:
          type: string
