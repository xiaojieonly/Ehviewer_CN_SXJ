openapi: 3.0.3
info:
  title: AnotherViewer WebUI Backend API
  description: |
    REST API for the AnotherViewer WebUI backend (Spring Boot).

    Authentication: all endpoints under /api/v1 require a bearer token
    (Authorization: Bearer <token>) except the publicly permitted ones
    (auth/register, auth/login, auth/status, auth/pair/complete, health,
    metrics, metrics/dashboard) and non-API resources.
  version: 1.1.0
  contact:
    name: AnotherViewer WebUI Team

servers:
  - url: http://localhost:8080
    description: Local development server

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Authentication and session management
  - name: Gallery
    description: Gallery search, detail, history, favorites, quick search
  - name: Favorite
    description: Remote favorites management (Gallery Site server-side)
  - name: History
    description: Local browsing history
  - name: Download
    description: Download task management and labels
  - name: Comment
    description: Gallery comments
  - name: Settings
    description: Server settings
  - name: Image
    description: Image proxy and streaming
  - name: Cache
    description: Cache statistics and management
  - name: Processing
    description: Image enhancement processing pipeline
  - name: Sync
    description: Android-Server sync protocol
  - name: Archive
    description: Gallery archive download
  - name: Torrent
    description: Gallery torrent download
  - name: SMB
    description: SMB network backup and sync
  - name: Backup
    description: Local backup export/restore (zip of slices + manifest.json)
  - name: Health
    description: Health check and metrics

paths:
  # ============================================================
  # Auth
  # ============================================================
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Registration failed (e.g. username taken, validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          description: Registration is disabled on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate and obtain a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/v1/auth/status:
    get:
      tags: [Auth]
      operationId: getAuthStatus
      summary: Check current authentication status
      security: []
      parameters:
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: "Bearer token (e.g. 'Bearer <token>')"
      responses:
        '200':
          description: Auth status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'

  /api/v1/auth/pair:
    post:
      tags: [Auth]
      operationId: generatePairCode
      summary: Generate a short-lived single-use pairing code for device pairing
      responses:
        '200':
          description: Pairing code generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairCodeResponse'
        '401':
          description: Authentication required

  /api/v1/auth/pair/start:
    post:
      tags: [Auth]
      operationId: generatePairCodeStart
      summary: Alias for POST /pair (openapi client compatibility)
      responses:
        '200':
          description: Pairing code generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairCodeResponse'
        '401':
          description: Authentication required

  /api/v1/auth/pair/complete:
    post:
      tags: [Auth]
      operationId: completePairing
      summary: Exchange a pairing code for a device-scoped bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairCompleteRequest'
      responses:
        '200':
          description: Device paired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairCompleteResponse'
        '400':
          description: Invalid or expired pairing code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairCompleteResponse'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Invalidate the current session token
      parameters:
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: "Bearer token to invalidate"
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Authentication required (token missing or invalid)

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the WebUI account password (auth mode must be enabled)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: "Wrong old password, invalid new password length, or auth disabled"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Authentication required (token missing or invalid)

  # ============================================================
  # Gallery
  # ============================================================
  /api/v1/gallery/search:
    get:
      tags: [Gallery]
      operationId: searchGallery
      summary: Search galleries with keyword, category filter, and pagination
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: Search keyword
        - name: category
          in: query
          required: false
          schema:
            type: integer
          description: Category bitmask filter
        - name: sort
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2, 3]
            default: 0
          description: >-
            Sort order (v1.1+): 0/absent = default order, 1 = posted time desc,
            2 = rating desc, 3 = title asc. Passed through to the site URL as
            f_order; mock-server implements this table as the test oracle.
        - name: pageMin
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Minimum page count (site params f_sp=on&f_spf=N); absent = no bound
        - name: pageMax
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Maximum page count (site params f_sp=on&f_spt=N); absent = no bound
        - name: minRating
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 5
          description: Minimum rating threshold (site params f_sr=on&f_srdd=N); 0/absent = disabled
        - name: searchName
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "Advanced search scope (advsearch=1&f_sname=on): match gallery name"
        - name: searchTags
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "Advanced search scope (advsearch=1&f_stags=on): match tags"
        - name: searchDesc
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "Advanced search scope (advsearch=1&f_sdesc=on): match description"
        - name: searchTorrents
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "Advanced search scope (advsearch=1&f_storr=on): match torrent filenames"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Page number (0-based)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Number of results per page
      responses:
        '200':
          description: Gallery list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryListResponse'

  /api/v1/gallery/{gid}:
    get:
      tags: [Gallery]
      operationId: getGalleryDetail
      summary: Get full detail for a single gallery
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Gallery ID
      responses:
        '200':
          description: Gallery detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryDetailDto'
        '404':
          description: Gallery not found

  /api/v1/gallery/history:
    get:
      tags: [Gallery]
      operationId: getGalleryHistory
      summary: Get paginated gallery browsing history (via GalleryService)
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Gallery history list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryListResponse'

  /api/v1/gallery/history/{gid}:
    post:
      tags: [Gallery]
      operationId: addToHistory
      summary: Record a gallery visit into history
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToHistoryRequest'
      responses:
        '200':
          description: Success flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/gallery/favorites:
    get:
      tags: [Gallery]
      operationId: getLocalFavorites
      summary: Get local favorites list
      responses:
        '200':
          description: Local favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryListResponse'

  /api/v1/gallery/quick-search:
    get:
      tags: [Gallery]
      operationId: getQuickSearches
      summary: List saved quick search presets
      responses:
        '200':
          description: Quick search list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickSearchListResponse'
    post:
      tags: [Gallery]
      operationId: createQuickSearch
      summary: Create a new quick search preset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickSearchDto'
      responses:
        '200':
          description: Created quick search
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickSearchDto'

  /api/v1/gallery/quick-search/{id}:
    delete:
      tags: [Gallery]
      operationId: deleteQuickSearch
      summary: Delete a quick search preset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ============================================================
  # Favorite (remote Gallery Site favorites)
  # ============================================================
  /api/v1/favorite/list:
    get:
      tags: [Favorite]
      operationId: listFavorites
      summary: List favorites from a specific slot with pagination
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Favorite folder slot (0-9)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number (1-based)
      responses:
        '200':
          description: Favorite list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteListResponse'

  /api/v1/favorite/add:
    post:
      tags: [Favorite]
      operationId: addFavorite
      summary: Add a gallery to favorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteAddRequest'
      responses:
        '200':
          description: Success flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/favorite/remove:
    delete:
      tags: [Favorite]
      operationId: removeFavorite
      summary: Remove a gallery from favorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteRemoveRequest'
      responses:
        '200':
          description: Success flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ============================================================
  # History (dedicated controller)
  # ============================================================
  /api/v1/history/list:
    get:
      tags: [History]
      operationId: listHistory
      summary: List all browsing history entries
      responses:
        '200':
          description: History list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryListResponse'

  /api/v1/history/clear:
    delete:
      tags: [History]
      operationId: clearHistory
      summary: Clear all browsing history
      responses:
        '200':
          description: Success flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ============================================================
  # Download
  # ============================================================
  /api/v1/download/list:
    get:
      tags: [Download]
      operationId: listDownloads
      summary: List download tasks, optionally filtered by label
      parameters:
        - name: label
          in: query
          required: false
          schema:
            type: integer
          description: Label ID filter
      responses:
        '200':
          description: Download list with labels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadListResponse'

  /api/v1/download/info/{id}:
    get:
      tags: [Download]
      operationId: getDownloadInfo
      summary: Get a single download task by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Download item (may be null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadItem'

  /api/v1/download/add:
    post:
      tags: [Download]
      operationId: addDownload
      summary: Add a new download task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadAddRequest'
      responses:
        '200':
          description: Whether the task was added
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/download/start/{id}:
    post:
      tags: [Download]
      operationId: startDownload
      summary: Start or resume a download task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Whether the operation succeeded
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/download/start-all:
    post:
      tags: [Download]
      operationId: startAllDownloads
      summary: Start all pending download tasks
      responses:
        '200':
          description: Always true
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/download/pause/{id}:
    post:
      tags: [Download]
      operationId: pauseDownload
      summary: Pause a running download task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Whether the operation succeeded
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/download/cancel/{id}:
    post:
      tags: [Download]
      operationId: cancelDownload
      summary: Cancel a download task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Whether the operation succeeded
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/download/delete/{id}:
    delete:
      tags: [Download]
      operationId: deleteDownload
      summary: Delete a download task and optionally its files
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Whether the operation succeeded
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/download/label:
    post:
      tags: [Download]
      operationId: createLabel
      summary: Create a new download label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadLabelRequest'
      responses:
        '200':
          description: Whether the label was created
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/download/label/{id}:
    delete:
      tags: [Download]
      operationId: deleteLabel
      summary: Delete a download label
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Whether the label was deleted
          content:
            application/json:
              schema:
                type: boolean

  # ============================================================
  # Comment
  # ============================================================
  /api/v1/comment/list/{gid}:
    get:
      tags: [Comment]
      operationId: listComments
      summary: List comments for a gallery
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Comment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentListResponse'

  /api/v1/comment/post:
    post:
      tags: [Comment]
      operationId: postComment
      summary: Post a comment on a gallery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentPostRequest'
      responses:
        '200':
          description: Success flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/comment/vote:
    post:
      tags: [Comment]
      operationId: voteComment
      summary: Vote on a comment (upvote or downvote)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentVoteRequest'
      responses:
        '200':
          description: Success flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ============================================================
  # Settings
  # ============================================================
  /api/v1/settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Get current server settings
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
    put:
      tags: [Settings]
      operationId: updateSettings
      summary: Update server settings (partial update supported)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateRequest'
      responses:
        '200':
          description: Whether the update succeeded
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/proxy/test:
    post:
      tags: [Settings]
      operationId: testProxy
      summary: Test connectivity to Gallery Site through a proxy (saved settings when no body)
      description: |
        With no body the currently saved proxy settings are used; with a body
        the given values are tested (all fields optional, merged over the
        saved settings), so the admin UI can validate a form before saving it.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyTestRequest'
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyTestResponse'

  # ============================================================
  # Preferences (per-user UI preferences)
  # ============================================================
  /api/v1/preferences:
    get:
      tags: [Settings]
      operationId: getPreferences
      summary: Get the authenticated user's UI preferences
      responses:
        '200':
          description: Current preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceResponse'
        '401':
          description: Authentication required
    put:
      tags: [Settings]
      operationId: updatePreferences
      summary: Update the authenticated user's UI preferences (deep merge, all fields optional)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenceUpdateRequest'
      responses:
        '200':
          description: Merged preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceResponse'
        '401':
          description: Authentication required

  # ============================================================
  # Image (existing proxy + new streaming)
  # ============================================================
  /api/v1/image/proxy:
    get:
      tags: [Image]
      operationId: proxyImage
      summary: Proxy and cache an image by its original URL
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: Original image URL to proxy
      responses:
        '200':
          description: Image binary data
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found in cache

  /api/v1/image/cache/status:
    get:
      tags: [Image]
      operationId: getImageCacheStatus
      summary: Get image cache size information
      responses:
        '200':
          description: Cache status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageCacheStatus'

  /api/v1/image/cache/clear:
    post:
      tags: [Image]
      operationId: clearImageCache
      summary: Clear all cached proxy images
      responses:
        '200':
          description: Success flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/image/{galleryId}/{page}:
    get:
      tags: [Image]
      operationId: streamGalleryImage
      summary: Stream a single gallery page image with on-demand fetching and caching
      description: |
        Returns the image for a specific page of a gallery. On cache miss, the server
        fetches the image via the core parser, caches it, and returns it.
        Supports HTTP Range requests for partial content (206) and unsatisfiable
        ranges (416). When `enhanced=1` is set, the AI-enhanced variant is served
        from the processing output directory if it exists (404 otherwise).
      parameters:
        - name: galleryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Gallery ID
        - name: page
          in: path
          required: true
          schema:
            type: integer
            format: int32
          description: Page number (0-based)
        - name: w
          in: query
          required: false
          schema:
            type: integer
            format: int32
          description: |
            Accepted for client compatibility; currently ignored by the server
            (the original resolution is always returned).
        - name: enhanced
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
            default: 0
          description: If 1, return the AI-enhanced version (if processed); otherwise return original
        - name: Range
          in: header
          required: false
          schema:
            type: string
          description: HTTP Range header for partial content (e.g. "bytes=0-1023")
      responses:
        '200':
          description: Full image
          headers:
            Content-Type:
              schema:
                type: string
              description: MIME type of the image (image/jpeg, image/png, image/webp, image/gif)
            Accept-Ranges:
              schema:
                type: string
              description: "Always 'bytes'"
            Cache-Control:
              schema:
                type: string
              description: "max-age=86400"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content (Range request)
          headers:
            Content-Range:
              schema:
                type: string
              description: "Range specifier (e.g. 'bytes 0-1023/4096')"
            Content-Type:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
              description: "Always 'bytes'"
            Cache-Control:
              schema:
                type: string
              description: "max-age=86400"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '401':
          description: Gallery Site session expired or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '404':
          description: Gallery or page not found (or enhanced variant not processed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageErrorResponse'
        '416':
          description: Range not satisfiable
          headers:
            Content-Range:
              schema:
                type: string
              description: "bytes */<size>"
        '429':
          description: Rate limited (concurrent fetch limit for this gallery reached)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageErrorResponse'

  # ============================================================
  # Cache
  # ============================================================
  /api/v1/cache/stats:
    get:
      tags: [Cache]
      operationId: getCacheStats
      summary: Get cache usage statistics
      description: Returns disk and memory cache usage including size, entry count, and hit rates.
      responses:
        '200':
          description: Cache statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheStats'

  /api/v1/cache/gallery/{id}:
    delete:
      tags: [Cache]
      operationId: clearGalleryCache
      summary: Clear all cached images for a specific gallery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Gallery ID
      responses:
        '200':
          description: Success flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Gallery not found in cache

  # ============================================================
  # Processing
  # ============================================================
  /api/v1/process/gallery/{id}:
    post:
      tags: [Processing]
      operationId: triggerGalleryProcessing
      summary: Trigger AI image enhancement for all pages of a gallery
      description: |
        Enqueues all pages of the gallery for background AI enhancement (e.g. waifu2x upscale/denoise).
        Returns a task ID that can be used to query progress.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Gallery ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessingRequest'
      responses:
        '200':
          description: Processing task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingTaskResponse'
        '404':
          description: Gallery not found
        '409':
          description: Processing already in progress for this gallery

  /api/v1/process/status/{taskId}:
    get:
      tags: [Processing]
      operationId: getProcessingStatus
      summary: Query the progress of an image processing task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
          description: Task ID returned by triggerGalleryProcessing
      responses:
        '200':
          description: Processing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingStatus'
        '404':
          description: Task not found

  /api/v1/process/cancel/{taskId}:
    post:
      tags: [Processing]
      operationId: cancelProcessing
      summary: Request cancellation of an image processing task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
          description: Task ID returned by triggerGalleryProcessing
      responses:
        '200':
          description: Cancel request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Task not found

  # ============================================================
  # Sync
  # ============================================================
  /api/v1/sync/push:
    post:
      tags: [Sync]
      operationId: syncPush
      summary: Push client changes to the server
      description: |
        Receives a batch of client entities wrapped in a SyncEntityCollection
        (favorites, history, downloads, bookmarks, filters, quick searches,
        download labels, preferences). Entities are merged server-side using
        per-entity strategies; tombstones are conveyed via `deleted` flags.
        The returned serverTimestamp should be used as the base for the next
        pull.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Push result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '401':
          description: Invalid or missing API token

  /api/v1/sync/pull:
    get:
      tags: [Sync]
      operationId: syncPull
      summary: Pull server changes since a given timestamp
      description: |
        Returns all server-side changes that occurred after the given
        timestamp, wrapped in a SyncEntityCollection. The client should store
        the returned serverTimestamp for the next pull.
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: Unix timestamp (milliseconds) — return changes after this time
        - name: deviceId
          in: query
          required: false
          schema:
            type: string
          description: Client device ID (used to exclude the requesting device's own changes)
      responses:
        '200':
          description: Server changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        '401':
          description: Invalid or missing API token

  /api/v1/sync/status:
    get:
      tags: [Sync]
      operationId: getSyncStatus
      summary: Get current sync status, connected devices, and entity counts
      responses:
        '200':
          description: Sync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusResponse'
        '401':
          description: Invalid or missing API token

  /api/v1/sync/devices:
    get:
      tags: [Sync]
      operationId: listDevices
      summary: List paired devices
      responses:
        '200':
          description: Paired device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceInfoDto'
        '401':
          description: Invalid or missing API token

  /api/v1/sync/devices/{deviceId}:
    delete:
      tags: [Sync]
      operationId: revokeDevice
      summary: Revoke a paired device and invalidate its token
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Invalid or missing API token
        '403':
          description: Device not found or not owned by this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sync/policy:
    get:
      tags: [Sync]
      operationId: getSyncPolicy
      summary: Get the current sync policy (ADR-0003, sync-conflict-rules v2 §8)
      responses:
        '200':
          description: Current policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPolicy'
        '401':
          description: Invalid or missing API token
    put:
      tags: [Sync]
      operationId: updateSyncPolicy
      summary: Update the sync policy (WebUI may change; the next android push carrying policy overrides it, D2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPolicy'
      responses:
        '200':
          description: Persisted policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPolicy'
        '400':
          description: Validation error (unknown strategy / out-of-range tier or interval)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or missing API token

  # ============================================================
  # Backup (local zip export/restore, R4-5)
  # ============================================================
  /api/v1/backup/export:
    get:
      tags: [Backup]
      operationId: exportBackup
      summary: Export a backup zip (slices + manifest.json), also persisted under <dataDir>/backups/
      parameters:
        - name: includeDownloads
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include the downloads slice in the backup
      responses:
        '200':
          description: Backup zip stream (anotherviewer-backup-<yyyyMMdd-HHmmss>.zip)
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: Invalid or missing API token

  /api/v1/backup/restore:
    post:
      tags: [Backup]
      operationId: restoreBackup
      summary: Upload a backup zip and restore (per-slice SHA-256 verified); a server restart is required for the restored data to take effect (R4-2)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Backup zip produced by /backup/export
      responses:
        '200':
          description: Restore succeeded (restart to take effect)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRestoreResponse'
        '400':
          description: Restore failed (empty file / missing manifest.json / bad slice checksum / path traversal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or missing API token

  # ============================================================
  # Archive
  # ============================================================
  /api/v1/archive/list/{gid}:
    get:
      tags: [Archive]
      operationId: listArchives
      summary: List available archive downloads for a gallery
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Archive list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveListResponse'

  /api/v1/archive/download:
    post:
      tags: [Archive]
      operationId: downloadArchive
      summary: Start downloading a gallery archive
      description: |
        200 `{success:true, path:"<gid>/"}` on success (path is a relative hint;
        absolute server paths are never exposed);
        400 `{success:false, message}` when the archive URL host is not allowed
        (SSRF guard);
        502 `{success:false, message}` when the archiver flow failed (credits
        required, upstream error).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveDownloadRequest'
      responses:
        '200':
          description: Archive download initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveDownloadResponse'
        '400':
          description: Archive URL host not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveDownloadResponse'
        '502':
          description: Archive download failed (credits required or upstream error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveDownloadResponse'

  # ============================================================
  # Torrent
  # ============================================================
  /api/v1/torrent/list/{gid}:
    get:
      tags: [Torrent]
      operationId: listTorrents
      summary: List available torrents for a gallery
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Torrent list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TorrentListResponse'

  /api/v1/torrent/download:
    get:
      tags: [Torrent]
      operationId: downloadTorrent
      summary: Download a torrent file by token
      description: |
        The `token` is a URL (typically an Gallery Site torrent page URL). Returns
        the raw `.torrent` file bytes as an `application/x-bittorrent`
        attachment (Content-Disposition `attachment; filename=<gid>.torrent`).
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Torrent download token (URL)
      responses:
        '200':
          description: Torrent file bytes
          headers:
            Content-Type:
              schema:
                type: string
              description: application/x-bittorrent
            Content-Disposition:
              schema:
                type: string
              description: "attachment; filename=<gid>.torrent"
          content:
            application/x-bittorrent:
              schema:
                type: string
                format: binary
        '404':
          description: Torrent file unavailable (host not allowed, fetch failed, or no file)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # SMB
  # ============================================================
  /api/v1/smb/config:
    get:
      tags: [SMB]
      operationId: getSmbConfig
      summary: Get current SMB backup configuration
      responses:
        '200':
          description: SMB config (may be null if never configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmbConfigResponse'
    put:
      tags: [SMB]
      operationId: updateSmbConfig
      summary: Create or update SMB backup configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmbConfigUpdateRequest'
      responses:
        '200':
          description: Whether the update succeeded
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/smb/test-connection:
    post:
      tags: [SMB]
      operationId: testSmbConnection
      summary: Test connectivity to an SMB share
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmbTestConnectionRequest'
      responses:
        '200':
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmbTestConnectionResponse'

  /api/v1/smb/sync:
    post:
      tags: [SMB]
      operationId: startSmbSync
      summary: Start an SMB backup sync operation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmbSyncRequest'
      responses:
        '200':
          description: Whether the sync was started
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/smb/cancel:
    post:
      tags: [SMB]
      operationId: cancelSmbSync
      summary: Cancel an in-progress SMB sync
      responses:
        '200':
          description: Whether the cancel succeeded
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/smb/progress:
    get:
      tags: [SMB]
      operationId: getSmbProgress
      summary: Get current SMB sync progress
      responses:
        '200':
          description: Sync progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmbSyncProgress'

  # ============================================================
  # Health
  # ============================================================
  /api/v1/health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Server health check
      security: []
      description: Returns overall server health including subsystem status.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Server is degraded or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/metrics:
    get:
      tags: [Health]
      operationId: getMetrics
      summary: Get flat server metrics
      security: []
      description: |
        Returns operational metrics as flat fields (uptime, JVM memory, active
        downloads, processing queue, cache usage). A legacy `metrics` map with
        per-metric `MetricValue` entries is retained for backward
        compatibility with existing consumers.
      responses:
        '200':
          description: Server metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'

  /api/v1/metrics/dashboard:
    get:
      tags: [Health]
      operationId: getDashboard
      summary: Get a structured dashboard snapshot
      security: []
      responses:
        '200':
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'

# ==============================================================
# Components
# ==============================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Bearer token issued by /api/v1/auth/login, /api/v1/auth/register, or /api/v1/auth/pair/complete"
  schemas:
    # ----------------------------------------------------------
    # Auth
    # ----------------------------------------------------------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          description: Current password
        newPassword:
          type: string
          minLength: 6
          maxLength: 72
          description: New password (BCrypt truncates beyond 72 bytes)

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        token:
          type: string
          nullable: true
        username:
          type: string
          nullable: true

    AuthStatusResponse:
      type: object
      properties:
        authenticated:
          type: boolean
          description: Whether a local WebUI account token was supplied and is valid
        username:
          type: string
          nullable: true
        authRequired:
          type: boolean
          description: Whether the server enforces authentication for API access
        ehSessionValid:
          type: boolean
          description: Whether the Gallery Site session (cookie store) is valid
        ehSessionExpired:
          type: boolean
          description: Whether the Gallery Site session has expired and needs re-authentication

    PairCodeResponse:
      type: object
      properties:
        code:
          type: string
          description: Six-character alphanumeric pairing code
        expiresAt:
          type: integer
          format: int64
          description: Expiry timestamp (ms epoch)

    PairCompleteRequest:
      type: object
      required: [code, deviceId, deviceName]
      properties:
        code:
          type: string
        deviceId:
          type: string
        deviceName:
          type: string
        platform:
          type: string
          default: android

    PairCompleteResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        token:
          type: string
        username:
          type: string
          nullable: true

    DeviceInfoDto:
      type: object
      properties:
        deviceId:
          type: string
        deviceName:
          type: string
        platform:
          type: string
        pairedAt:
          type: integer
          format: int64
        lastSeen:
          type: integer
          format: int64

    # ----------------------------------------------------------
    # Gallery
    # ----------------------------------------------------------
    GalleryListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/GalleryItemDto'
        total:
          type: integer

    GalleryItemDto:
      type: object
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        galleryUrl:
          type: string
          readOnly: true
        title:
          type: string
          nullable: true
        titleJpn:
          type: string
          nullable: true
        thumb:
          type: string
          nullable: true
        category:
          type: integer
        posted:
          type: string
          nullable: true
        uploader:
          type: string
          nullable: true
        rating:
          type: number
          format: float
        rated:
          type: boolean
        simpleLanguage:
          type: string
          nullable: true
        simpleTags:
          type: array
          items:
            type: string
        thumbWidth:
          type: integer
        thumbHeight:
          type: integer
        pages:
          type: integer
        favoriteSlot:
          type: integer
        favoriteName:
          type: string
          nullable: true

    GalleryDetailDto:
      type: object
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        galleryUrl:
          type: string
          readOnly: true
        title:
          type: string
          nullable: true
        titleJpn:
          type: string
          nullable: true
        thumb:
          type: string
          nullable: true
        category:
          type: integer
        posted:
          type: string
          nullable: true
        uploader:
          type: string
          nullable: true
        rating:
          type: number
          format: float
        rated:
          type: boolean
        simpleLanguage:
          type: string
          nullable: true
        simpleTags:
          type: array
          items:
            type: string
        thumbWidth:
          type: integer
        thumbHeight:
          type: integer
        pages:
          type: integer
        favoriteSlot:
          type: integer
        favoriteName:
          type: string
          nullable: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDto'
        imageUrl:
          type: string
          nullable: true

    TagDto:
      type: object
      properties:
        namespace:
          type: string
          nullable: true
        tag:
          type: string

    AddToHistoryRequest:
      type: object
      properties:
        token:
          type: string
        title:
          type: string
          nullable: true

    QuickSearchListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/QuickSearchDto'

    QuickSearchDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        mode:
          type: integer
        category:
          type: integer
        keyword:
          type: string
          nullable: true
        advanceSearch:
          type: integer
        minRating:
          type: integer
        pageFrom:
          type: integer
        pageTo:
          type: integer
        sort:
          type: integer
          enum: [0, 1, 2, 3]
          default: 0
          description: >-
            Sort order persisted with the preset (W3 R4-11; same semantics as
            GET /api/v1/gallery/search `sort`): 0 = default order,
            1 = posted time desc, 2 = rating desc, 3 = title asc. Applied
            when the preset is loaded. Absent on legacy rows (reads as 0).
            REST-only: SyncQuickSearchDto (app schema) intentionally has no
            sort — presets keep it when stored via REST, the app ignores it.

    # ----------------------------------------------------------
    # Favorite
    # ----------------------------------------------------------
    FavoriteListResponse:
      type: object
      properties:
        favorites:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteItem'
        totalPages:
          type: integer
        currentPage:
          type: integer

    FavoriteItem:
      type: object
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        title:
          type: string
        titleJpn:
          type: string
        thumb:
          type: string
        category:
          type: integer
          description: Gallery category bitmask
        rating:
          type: number
          format: float
        uploader:
          type: string
          nullable: true
        posted:
          type: string
          nullable: true

    FavoriteAddRequest:
      type: object
      required: [gid, token, category]
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        category:
          type: integer

    FavoriteRemoveRequest:
      type: object
      required: [gid, token, category]
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        category:
          type: integer

    # ----------------------------------------------------------
    # History
    # ----------------------------------------------------------
    HistoryListResponse:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'

    HistoryItem:
      type: object
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        title:
          type: string
        titleJpn:
          type: string
        thumb:
          type: string
        category:
          type: integer
          description: Gallery category bitmask
        rating:
          type: number
          format: float
        mode:
          type: integer
        time:
          type: integer
          format: int64

    # ----------------------------------------------------------
