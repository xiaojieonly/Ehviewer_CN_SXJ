  /api/v1/process/cancel/{taskId}:
    post:
      tags: [Processing]
      operationId: cancelProcessing
      summary: Request cancellation of an image processing task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
          description: Task ID returned by triggerGalleryProcessing
      responses:
        '200':
          description: Cancel request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Task not found

  # ============================================================
  # Sync
  # ============================================================
  /api/v1/sync/push:
    post:
      tags: [Sync]
      operationId: syncPush
      summary: Push client changes to the server
      description: |
        Receives a batch of client entities wrapped in a SyncEntityCollection
        (favorites, history, downloads, bookmarks, filters, quick searches,
        download labels, preferences). Entities are merged server-side using
        per-entity strategies; tombstones are conveyed via `deleted` flags.
        The returned serverTimestamp should be used as the base for the next
        pull.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Push result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '401':
          description: Invalid or missing API token

  /api/v1/sync/pull:
    get:
      tags: [Sync]
      operationId: syncPull
      summary: Pull server changes since a given timestamp
      description: |
        Returns all server-side changes that occurred after the given
        timestamp, wrapped in a SyncEntityCollection. The client should store
        the returned serverTimestamp for the next pull.
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: Unix timestamp (milliseconds) — return changes after this time
        - name: deviceId
          in: query
          required: false
          schema:
            type: string
          description: Client device ID (used to exclude the requesting device's own changes)
      responses:
        '200':
          description: Server changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        '401':
          description: Invalid or missing API token

  /api/v1/sync/status:
    get:
      tags: [Sync]
      operationId: getSyncStatus
      summary: Get current sync status, connected devices, and entity counts
      responses:
        '200':
          description: Sync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusResponse'
        '401':
          description: Invalid or missing API token

  /api/v1/sync/devices:
    get:
      tags: [Sync]
      operationId: listDevices
      summary: List paired devices
      responses:
        '200':
          description: Paired device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceInfoDto'
        '401':
          description: Invalid or missing API token

  /api/v1/sync/devices/{deviceId}:
    delete:
      tags: [Sync]
      operationId: revokeDevice
      summary: Revoke a paired device and invalidate its token
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Invalid or missing API token
        '403':
          description: Device not found or not owned by this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sync/policy:
    get:
      tags: [Sync]
      operationId: getSyncPolicy
      summary: Get the current sync policy (ADR-0003, sync-conflict-rules v2 §8)
      responses:
        '200':
          description: Current policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPolicy'
        '401':
          description: Invalid or missing API token
    put:
      tags: [Sync]
      operationId: updateSyncPolicy
      summary: Update the sync policy (WebUI may change; the next android push carrying policy overrides it, D2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPolicy'
      responses:
        '200':
          description: Persisted policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPolicy'
        '400':
          description: Validation error (unknown strategy / out-of-range tier or interval)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or missing API token

  # ============================================================
  # Backup (local zip export/restore, R4-5)
  # ============================================================
  /api/v1/backup/export:
    get:
      tags: [Backup]
      operationId: exportBackup
      summary: Export a backup zip (slices + manifest.json), also persisted under <dataDir>/backups/
      parameters:
        - name: includeDownloads
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include the downloads slice in the backup
      responses:
        '200':
          description: Backup zip stream (anotherviewer-backup-<yyyyMMdd-HHmmss>.zip)
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: Invalid or missing API token

  /api/v1/backup/export/async:
    post:
      tags: [Backup]
      operationId: exportBackupAsync
      summary: Start an asynchronous backup export job (EXPORT, B3)
      description: |
        Asynchronous variant of GET /api/v1/backup/export: the export runs in
        the background; when the job reaches COMPLETED the zip is fetched with
        GET /api/v1/backup/export/{jobId}. The synchronous GET
        /api/v1/backup/export remains for compatibility (A2).
      parameters:
        - name: includeDownloads
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include the downloads slice in the backup
      responses:
        '202':
          description: Export job submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '401':
          description: Invalid or missing API token
        '409':
          description: 'Another EXPORT job is already active (code=CONFLICT)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/backup/export/{jobId}:
    get:
      tags: [Backup]
      operationId: downloadExport
      summary: Download the backup zip produced by an EXPORT job (COMPLETED only)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
          description: Job ID returned by POST /api/v1/backup/export/async
      responses:
        '200':
          description: Backup zip stream (anotherviewer-backup-<stamp>.zip)
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: Invalid or missing API token
        '404':
          description: 'Unknown job (code=EXPORT_NOT_FOUND)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '409':
          description: 'Export job not COMPLETED yet (code=EXPORT_NOT_READY)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/backup/restore:
    post:
      tags: [Backup]
      operationId: restoreBackup
      summary: Upload a backup zip and restore asynchronously (RESTORE job, B3)
      description: |
        Submits a RESTORE background job (per-slice SHA-256 verified inside the
        worker); 202 returns the job handle. On completion the runtime state is
        set as before (GET /api/v1/backup/state → restorePending=true) and a
        server restart is required for the restored data to take effect (R4-2).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Backup zip produced by /backup/export
      responses:
        '202':
          description: Restore job submitted (completion result mirrors BackupRestoreResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '400':
          description: Restore failed (empty file / missing manifest.json / bad slice checksum / path traversal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or missing API token
        '409':
          description: 'Another RESTORE job is already active (code=CONFLICT)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/backup/state:
    get:
      tags: [Backup]
      operationId: getBackupState
      summary: Restore runtime-awareness state (R4-2); restorePending=true means a restore succeeded and a server restart is required to take effect
      responses:
        '200':
          description: Current backup/restore runtime state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupStateResponse'
        '401':
          description: Invalid or missing API token

  /api/v1/backup/import-ehviewer:
    post:
      tags: [Backup]
      operationId: importEhViewer
      summary: Import an original EhViewer backup db (optional cookies db/JSON) into local user data as an IMPORT job (B3)
      description: |
        Table-driven scan of the uploaded sqlite export; known tables are mapped
        per-table, gid conflicts are skipped unless force=true (upsert). Optional
        cookies file accepts an okhttp3-cookie.db or an equivalent JSON array;
        only gallery-site domain cookies are imported.

        Breaking change (B3): the previous synchronous 200 EhImportResponse is
        replaced by 202 JobSubmitResponse; poll GET /api/v1/jobs/{jobId} (or
        re-attach via GET /api/v1/jobs/active?type=IMPORT). The per-table counts
        arrive as the JobDto.result (EhImportResponse shape) on completion.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: EhViewer export db (anotherviewer.db)
                cookies:
                  type: string
                  format: binary
                  description: Optional okhttp3-cookie.db or cookie JSON array
                force:
                  type: boolean
                  default: false
                  description: Upsert on gid conflicts instead of skipping
      responses:
        '202':
          description: Import job submitted (per-table counts arrive as JobDto.result on completion)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '400':
          description: Import failed (empty file / unreadable db / import error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or missing API token
        '409':
          description: 'Another IMPORT job is already active (code=CONFLICT)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  # ============================================================
  # Jobs (统一后台任务, plan 2026-08-06)
  # ============================================================
  /api/v1/jobs/{jobId}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get the current state of a background job (polling + refresh re-attach)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
          description: Job ID returned by the async submit endpoints
      responses:
        '200':
          description: Job state (PENDING/RUNNING/COMPLETED/FAILED with progress and terminal result)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDto'
        '401':
          description: Invalid or missing API token
        '404':
          description: 'Unknown job (code=JOB_NOT_FOUND)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/jobs/active:
    get:
      tags: [Jobs]
      operationId: getActiveJob
      summary: Get the active job of a given type (re-attach after refresh/reconnect)
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/JobType'
          description: Job type filter
      responses:
        '200':
          description: Active job (PENDING/RUNNING) of the requested type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDto'
        '401':
          description: Invalid or missing API token
        '404':
          description: 'No active job of the requested type (code=NO_ACTIVE_JOB)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  # ============================================================
  # Archive
  # ============================================================
  /api/v1/archive/list/{gid}:
    get:
      tags: [Archive]
      operationId: listArchives
      summary: List available archive downloads for a gallery
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Archive list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveListResponse'

  /api/v1/archive/download:
    post:
      tags: [Archive]
      operationId: downloadArchive
      summary: Start downloading a gallery archive
      description: |
        200 `{success:true, path:"<gid>/"}` on success (path is a relative hint;
        absolute server paths are never exposed);
        400 `{success:false, message}` when the archive URL host is not allowed
        (SSRF guard);
        502 `{success:false, message}` when the archiver flow failed (credits
        required, upstream error).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveDownloadRequest'
      responses:
        '200':
          description: Archive download initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveDownloadResponse'
        '400':
          description: Archive URL host not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveDownloadResponse'
        '502':
          description: Archive download failed (credits required or upstream error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveDownloadResponse'

  # ============================================================
  # Torrent
  # ============================================================
  /api/v1/torrent/list/{gid}:
    get:
      tags: [Torrent]
      operationId: listTorrents
      summary: List available torrents for a gallery
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Torrent list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TorrentListResponse'

  /api/v1/torrent/download:
    get:
      tags: [Torrent]
      operationId: downloadTorrent
      summary: Download a torrent file by token
      description: |
        The `token` is a URL (typically an Gallery Site torrent page URL). Returns
        the raw `.torrent` file bytes as an `application/x-bittorrent`
        attachment (Content-Disposition `attachment; filename=<gid>.torrent`).
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Torrent download token (URL)
      responses:
        '200':
          description: Torrent file bytes
          headers:
            Content-Type:
              schema:
                type: string
              description: application/x-bittorrent
            Content-Disposition:
              schema:
                type: string
              description: "attachment; filename=<gid>.torrent"
          content:
            application/x-bittorrent:
              schema:
                type: string
                format: binary
        '404':
          description: Torrent file unavailable (host not allowed, fetch failed, or no file)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # SMB
  # ============================================================
  /api/v1/smb/config:
    get:
      tags: [SMB]
      operationId: getSmbConfig
      summary: Get current SMB backup configuration
      responses:
        '200':
          description: SMB config (may be null if never configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmbConfigResponse'
    put:
      tags: [SMB]
      operationId: updateSmbConfig
      summary: Create or update SMB backup configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmbConfigUpdateRequest'
      responses:
        '200':
          description: Whether the update succeeded
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/smb/test-connection:
    post:
      tags: [SMB]
      operationId: testSmbConnection
      summary: Test connectivity to an SMB share
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmbTestConnectionRequest'
      responses:
        '200':
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmbTestConnectionResponse'

  /api/v1/smb/sync:
    post:
      tags: [SMB]
      operationId: startSmbSync
      summary: Start an SMB backup sync operation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmbSyncRequest'
      responses:
        '200':
          description: Whether the sync was started
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/smb/cancel:
    post:
      tags: [SMB]
      operationId: cancelSmbSync
      summary: Cancel an in-progress SMB sync
      responses:
        '200':
          description: Whether the cancel succeeded
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/smb/progress:
    get:
      tags: [SMB]
      operationId: getSmbProgress
      summary: Get current SMB sync progress
      responses:
        '200':
          description: Sync progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmbSyncProgress'

  # ============================================================
  # Health
  # ============================================================
  /api/v1/health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Server health check
      security: []
      description: Returns overall server health including subsystem status.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Server is degraded or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/metrics:
    get:
      tags: [Health]
      operationId: getMetrics
      summary: Get flat server metrics
      security: []
      description: |
        Returns operational metrics as flat fields (uptime, JVM memory, active
        downloads, processing queue, cache usage). A legacy `metrics` map with
        per-metric `MetricValue` entries is retained for backward
        compatibility with existing consumers.
      responses:
        '200':
          description: Server metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'

  /api/v1/metrics/dashboard:
    get:
      tags: [Health]
      operationId: getDashboard
      summary: Get a structured dashboard snapshot
      security: []
      responses:
        '200':
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'

# ==============================================================
# Components
# ==============================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Bearer token issued by /api/v1/auth/login, /api/v1/auth/register, or /api/v1/auth/pair/complete"
  schemas:
    # ----------------------------------------------------------
    # Auth
    # ----------------------------------------------------------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          description: Current password
        newPassword:
          type: string
          minLength: 6
          maxLength: 72
          description: New password (BCrypt truncates beyond 72 bytes)

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        token:
          type: string
          nullable: true
        username:
          type: string
          nullable: true

    AuthStatusResponse:
      type: object
      properties:
        authenticated:
          type: boolean
          description: Whether a local WebUI account token was supplied and is valid
        username:
          type: string
          nullable: true
        authRequired:
          type: boolean
          description: Whether the server enforces authentication for API access
        ehSessionValid:
          type: boolean
          description: Whether the Gallery Site session (cookie store) is valid
        ehSessionExpired:
          type: boolean
          description: Whether the Gallery Site session has expired and needs re-authentication

    EhSessionResponse:
      type: object
      properties:
        signedIn:
          type: boolean
          description: Whether Gallery Site identity cookies are present
        expired:
          type: boolean
          description: Whether the Gallery Site session has expired and needs re-authentication
        gallerySite:
          type: integer
          default: 0
          description: Selected Gallery Site (0 = e-hentai, 1 = exhentai)
        cookies:
          type: array
          items:
            $ref: '#/components/schemas/EhSessionCookieDto'

    EhSiteRequest:
      type: object
      required: [gallerySite]
      properties:
        gallerySite:
          type: integer
          minimum: 0
          maximum: 1
          description: Target Gallery Site (0 = e-hentai, 1 = exhentai)

    EhSessionCookieDto:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        domain:
          type: string
        expiresAt:
          type: integer
          format: int64
          description: Cookie expiry timestamp (ms epoch); 253402300799999 for cookies without an explicit expiry

    PairCodeResponse:
      type: object
      properties:
        code:
          type: string
          description: Six-character alphanumeric pairing code
        expiresAt:
          type: integer
          format: int64
          description: Expiry timestamp (ms epoch)

    PairCompleteRequest:
      type: object
      required: [code, deviceId, deviceName]
      properties:
        code:
          type: string
        deviceId:
          type: string
        deviceName:
          type: string
        platform:
          type: string
          default: android

    PairCompleteResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        token:
          type: string
        username:
          type: string
          nullable: true

    DeviceInfoDto:
      type: object
      properties:
        deviceId:
          type: string
        deviceName:
          type: string
        platform:
          type: string
        pairedAt:
          type: integer
          format: int64
        lastSeen:
          type: integer
          format: int64

    # ----------------------------------------------------------
    # Gallery
    # ----------------------------------------------------------
    GalleryListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/GalleryItemDto'
        total:
          type: integer

    GalleryItemDto:
      type: object
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        galleryUrl:
          type: string
          readOnly: true
        title:
          type: string
          nullable: true
        titleJpn:
          type: string
          nullable: true
        thumb:
          type: string
          nullable: true
        category:
          type: integer
        posted:
          type: string
          nullable: true
        uploader:
          type: string
          nullable: true
        rating:
          type: number
          format: float
        rated:
          type: boolean
        simpleLanguage:
          type: string
          nullable: true
        simpleTags:
          type: array
          items:
            type: string
        thumbWidth:
          type: integer
        thumbHeight:
          type: integer
        pages:
          type: integer
        favoriteSlot:
          type: integer
        favoriteName:
          type: string
          nullable: true

    TopListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/TopListFeedItemDto'
        total:
          type: integer

    TopListFeedItemDto:
      type: object
      properties:
        gid:
          type: string
          nullable: true
        token:
          type: string
          nullable: true
        tag:
          type: string
          nullable: true
        value:
          type: string
          nullable: true
        href:
          type: string
          nullable: true

    FeedErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

    GalleryDetailDto:
      type: object
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        galleryUrl:
          type: string
          readOnly: true
        title:
          type: string
          nullable: true
        titleJpn:
          type: string
          nullable: true
        thumb:
          type: string
          nullable: true
        category:
          type: integer
        posted:
          type: string
          nullable: true
        uploader:
          type: string
          nullable: true
        rating:
          type: number
          format: float
        rated:
          type: boolean
        simpleLanguage:
          type: string
          nullable: true
        simpleTags:
          type: array
          items:
            type: string
        thumbWidth:
          type: integer
        thumbHeight:
          type: integer
        pages:
          type: integer
        favoriteSlot:
          type: integer
        favoriteName:
          type: string
          nullable: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDto'
        imageUrl:
          type: string
          nullable: true

    TagDto:
      type: object
      properties:
        namespace:
          type: string
          nullable: true
        tag:
          type: string

    AddToHistoryRequest:
      type: object
      properties:
        token:
          type: string
        title:
          type: string
          nullable: true

    QuickSearchListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/QuickSearchDto'

    QuickSearchDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        mode:
          type: integer
        category:
          type: integer
        keyword:
          type: string
          nullable: true
        advanceSearch:
          type: integer
        minRating:
          type: integer
        pageFrom:
          type: integer
        pageTo:
          type: integer
        sort:
          type: integer
          enum: [0, 1, 2, 3]
          default: 0
          description: >-
            Sort order persisted with the preset (W3 R4-11; same semantics as
            GET /api/v1/gallery/search `sort`): 0 = default order,
            1 = posted time desc, 2 = rating desc, 3 = title asc. Applied
            when the preset is loaded. Absent on legacy rows (reads as 0).
            REST-only: SyncQuickSearchDto (app schema) intentionally has no
            sort — presets keep it when stored via REST, the app ignores it.

    # ----------------------------------------------------------
    # Favorite
    # ----------------------------------------------------------
    FavoriteListResponse:
      type: object
      properties:
        favorites:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteItem'
        totalPages:
          type: integer
        currentPage:
          type: integer

    FavoriteItem:
      type: object
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        title:
          type: string
        titleJpn:
          type: string
        thumb:
          type: string
        category:
          type: integer
          description: Gallery category bitmask
        rating:
          type: number
          format: float
        uploader:
          type: string
          nullable: true
        posted:
          type: string
          nullable: true

    FavoriteAddRequest:
      type: object
      required: [gid, token, category]
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        category:
          type: integer

    FavoriteRemoveRequest:
      type: object
      required: [gid, token, category]
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        category:
          type: integer

    # ----------------------------------------------------------
    # History
    # ----------------------------------------------------------
    HistoryListResponse:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'

    HistoryItem:
      type: object
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        title:
          type: string
        titleJpn:
          type: string
        thumb:
          type: string
        category:
          type: integer
          description: Gallery category bitmask
        rating:
          type: number
          format: float
        mode:
          type: integer
        time:
          type: integer
          format: int64

    # ----------------------------------------------------------
    # Download
    # ----------------------------------------------------------
    DownloadListResponse:
      type: object
      properties:
        downloads:
          type: array
          items:
            $ref: '#/components/schemas/DownloadItem'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/DownloadLabel'
        total:
          type: integer
          description: Total rows under the current label filter, counted before pagination (A5)

    DownloadItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        gid:
          type: integer
          format: int64
        token:
          type: string
        title:
          type: string
          nullable: true
        titleJpn:
          type: string
          nullable: true
        thumb:
          type: string
          nullable: true
        category:
          type: integer
        state:
          type: integer
          description: "Download state: 0=NONE/pending, 1=WAIT, 2=DOWNLOADING, 3=FINISHED, 4=FAILED"
        total:
          type: integer
        done:
          type: integer
        label:
          type: integer
        downloadDir:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
          description: Human-readable failure/cancel reason (null when the task has not failed)

    DownloadLabel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        time:
          type: integer
          format: int64

    DownloadAddRequest:
      type: object
      required: [gid, token]
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        title:
          type: string
          nullable: true
        thumb:
          type: string
          nullable: true
        label:
          type: integer
          default: 0

    DownloadLabelRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string

    DownloadRangeRequest:
      type: object
      description: >-
        Batch target. `all=true` ignores ids and resolves the whole set
        server-side using the (label, q) filters (cross-page select-all).
      properties:
        ids:
          type: array
          maxItems: 500
          items:
            type: integer
            format: int64
          description: Explicit id list (required when all=false)
        all:
          type: boolean
          default: false
          description: Act on the full filtered set instead of ids
        label:
          type: integer
          description: Label filter for all-mode (0/absent = every label)
        q:
          type: string
          maxLength: 256
          description: Title search filter for all-mode (absent = every entry)

    DownloadMoveRequest:
      type: object
      description: Move batch — same target semantics as DownloadRangeRequest.
      properties:
        ids:
          type: array
          maxItems: 500
          items:
            type: integer
            format: int64
          description: Explicit id list (required when all=false)
        all:
          type: boolean
          default: false
        label:
          type: integer
          description: Label filter for all-mode (0/absent = every label)
        q:
          type: string
          maxLength: 256
          description: Title search filter for all-mode (absent = every entry)
        labelId:
          type: integer
          minimum: 0
          default: 0
          description: Target label id (0 = move back to the default label)

    DownloadProgress:
      type: object
      properties:
        gid:
          type: integer
          format: int64
        state:
          type: integer
        downloaded:
          type: integer
        total:
          type: integer
        speed:
          type: integer
          format: int64
        label:
          type: integer

    # ----------------------------------------------------------
    # Comment
    # ----------------------------------------------------------
    CommentListResponse:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentItem'

    CommentItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uploader:
          type: string
        comment:
          type: string
        time:
          type: string
        score:
          type: integer

    CommentPostRequest:
      type: object
      required: [gid, comment]
      properties:
        gid:
          type: integer
          format: int64
        comment:
          type: string

    CommentVoteRequest:
      type: object
      required: [gid, commentId, vote]
      properties:
        gid:
          type: integer
          format: int64
        commentId:
          type: integer
          format: int64
        vote:
          type: integer
          description: "1 for upvote, -1 for downvote"

    # ----------------------------------------------------------
    # Settings
    # ----------------------------------------------------------
    SettingsResponse:
      type: object
      properties:
        download:
          $ref: '#/components/schemas/DownloadSettings'
        cache:
          $ref: '#/components/schemas/CacheSettings'
        smb:
          $ref: '#/components/schemas/SmbSettings'
        security:
          $ref: '#/components/schemas/SecuritySettings'
        processing:
          $ref: '#/components/schemas/ProcessingSettings'
        proxy:
          $ref: '#/components/schemas/ProxySettings'

    DownloadSettings:
      type: object
      properties:
        path:
          type: string
        workerCount:
          type: integer
        downloadDelay:
          type: integer
        downloadTimeout:
          type: integer
          format: int64
        maxConcurrentGalleries:
          type: integer
        maxConcurrentImages:
          type: integer

    CacheSettings:
      type: object
      properties:
        path:
          type: string
        sizeMb:
          type: integer
          format: int64

    SmbSettings:
      type: object
      properties:
        enabled:
          type: boolean

    SettingsUpdateRequest:
      type: object
      properties:
        download:
          $ref: '#/components/schemas/DownloadSettings'
        cache:
          $ref: '#/components/schemas/CacheSettings'
        smb:
          $ref: '#/components/schemas/SmbSettings'
        security:
          $ref: '#/components/schemas/SecuritySettings'
        processing:
          $ref: '#/components/schemas/ProcessingSettings'
        proxy:
          $ref: '#/components/schemas/ProxySettings'

    SecuritySettings:
      type: object
      properties:
        requireAuth:
          type: boolean
        sessionTimeout:
          type: integer
          format: int64

    ProcessingSettings:
      type: object
      properties:
        enabled:
          type: boolean
        defaultType:
          type: string
        outputFormat:
          type: string
        outputQuality:
          type: integer

    ProxySettings:
      type: object
      properties:
        enabled:
          type: boolean
        type:
          type: string
          enum: [http, socks5]
          default: http
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
          description: Empty string unless a password has been set; the stored password is never returned
        proxyPasswordSet:
          type: boolean
          description: Whether a proxy password is currently stored on the server

    # ----------------------------------------------------------
    # Proxy
    # ----------------------------------------------------------
    ProxyTestRequest:
      type: object
      description: All fields optional; omitted fields fall back to the currently saved settings
      properties:
        enabled:
          type: boolean
          nullable: true
        type:
          type: string
          nullable: true
        host:
          type: string
          nullable: true
        port:
          type: integer
          nullable: true
        username:
          type: string
          nullable: true
        password:
          type: string
          nullable: true

    ProxyTestResponse:
      type: object
      properties:
        success:
          type: boolean
          description: True when the proxy returned a successful (or sub-500) response
        latencyMs:
          type: integer
          format: int64
        error:
          type: string
          description: Error message (empty string on success)

    # ----------------------------------------------------------
    # Image
    # ----------------------------------------------------------
    ImageCacheStatus:
      type: object
      properties:
        cacheSize:
          type: integer
          description: Number of entries currently held in the in-memory image cache

    ImageErrorResponse:
      type: object
      properties:
        error:
          type: string
        galleryId:
          type: integer
          format: int64
        page:
          type: integer

    # ----------------------------------------------------------
    # Cache
    # ----------------------------------------------------------
    CacheStats:
      type: object
      properties:
        diskCacheSizeBytes:
          type: integer
          format: int64
          description: Total disk cache size in bytes
        diskCacheMaxBytes:
          type: integer
          format: int64
          description: Configured disk cache capacity in bytes
        memoryCacheEntries:
          type: integer
          description: Number of entries in memory (hot) cache
        memoryCacheMaxEntries:
          type: integer
          description: Configured memory cache entry limit
        hitCount:
          type: integer
          format: int64
          description: Total cache hits since startup
        missCount:
          type: integer
          format: int64
          description: Total cache misses since startup
        hitRate:
          type: number
          format: double
          description: Cache hit rate (0.0 - 1.0)

    # ----------------------------------------------------------
    # Processing
    # ----------------------------------------------------------
    ProcessingRequest:
      type: object
      properties:
        type:
          type: string
          enum: [UPSCALE_2X, UPSCALE_4X, DENOISE, DENOISE_UPSCALE]
          default: UPSCALE_2X
          description: Processing type to apply
        outputFormat:
          type: string
          enum: [png, webp, jpg]
          default: png
          description: Output image format
        quality:
          type: integer
          default: 90
          minimum: 1
          maximum: 100
          description: Output quality (for lossy formats)

    ProcessingTaskResponse:
      type: object
      properties:
        taskId:
          type: string
          description: Unique task identifier for status polling
        galleryId:
          type: integer
          format: int64
        totalPages:
          type: integer
          description: Number of pages enqueued for processing
        state:
          type: string
          enum: [PENDING, PROCESSING, DONE, FAILED]

    ProcessingStatus:
      type: object
      properties:
        taskId:
          type: string
        galleryId:
          type: integer
          format: int64
        state:
          type: string
          enum: [PENDING, PROCESSING, DONE, FAILED]
        totalPages:
          type: integer
        processedPages:
          type: integer
        failedPages:
          type: integer
        currentPage:
          type: integer
          description: Page currently being processed (-1 if idle)
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
          description: Error message if state is FAILED

    # ----------------------------------------------------------
    # Sync
    # ----------------------------------------------------------
    SyncPushRequest:
      type: object
      required: [entities, deviceId, timestamp]
      properties:
        entities:
          $ref: '#/components/schemas/SyncEntityCollection'
        deviceId:
          type: string
          description: ID of the client device performing the push
        timestamp:
          type: integer
          format: int64
          description: Client's current timestamp (ms epoch) for conflict resolution
        policy:
          allOf:
            - $ref: '#/components/schemas/SyncPolicy'
          description: Optional (v2). Authoritative when the pushing device is android-platform (ADR-0003 D2); web-originated pushes must not carry it.

    SyncPushResponse:
      type: object
      required: [success, serverTimestamp]
      properties:
        success:
          type: boolean
        serverTimestamp:
          type: integer
          format: int64
          description: Server timestamp after applying changes (use as the base for the next pull)
        conflicts:
          type: integer
          description: Number of conflicts resolved (last-write-wins)

    SyncPullResponse:
      type: object
      required: [entities, serverTimestamp]
      properties:
        entities:
          $ref: '#/components/schemas/SyncEntityCollection'
        serverTimestamp:
          type: integer
          format: int64
          description: Current server timestamp (use as 'since' for the next pull)
        policy:
          allOf:
            - $ref: '#/components/schemas/SyncPolicy'
          description: Optional (v2). Current server sync policy; absent on legacy servers → client falls back to lww without error.

    SyncPolicy:
      type: object
      required: [conflictStrategy, clientTier, autoSyncIntervalSec]
      properties:
        conflictStrategy:
          type: string
          enum: [device_priority, lww, web_priority]
          default: device_priority
          description: >-
            Conflict arbitration strategy (sync-conflict-rules v2 §1.4):
            device_priority = android wins cross-platform same-key conflicts;
            lww = v1 last-write-wins + skew tie-break (full fallback);
            web_priority = web wins.
        clientTier:
          type: integer
          enum: [0, 1, 2, 3]
          default: 1
          description: "Client behavior tier (D3): 0 independent, 1 sync+streaming, 2 browsing proxied via server, 3 download hosting (deferred)"
        autoSyncIntervalSec:
          type: integer
          minimum: 0
          default: 900
          description: Network-aware auto-sync interval (D4); 0 = trigger on network change only

    BackupRestoreResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
          description: Human-readable result note (e.g. 还原成功，重启后生效)

    BackupStateResponse:
      type: object
      required: [restorePending]
      properties:
        restorePending:
          type: boolean
          description: true = a restore succeeded and a server restart is required to take effect (R4-2); false otherwise (fresh instance / after restart)

    EhImportedCounts:
      type: object
      description: Per-table imported row counts (B3 contract)
      properties:
        downloads:
          type: integer
        history:
          type: integer
        filters:
          type: integer
        quickSearches:
          type: integer
        labels:
          type: integer
        bookmarks:
          type: integer
        favorites:
          type: integer
        dirnames:
          type: integer
        blackList:
          type: integer
        galleryTags:
          type: integer

    EhCookieImportResult:
      type: object
      description: Cookie segment result; siteDomain = cookies on gallery-site domains, imported = actually written to the session cookie store
      properties:
        imported:
          type: integer
        siteDomain:
          type: integer

    EhImportResponse:
      type: object
      required: [success, imported, cookies, skipped]
      properties:
        success:
          type: boolean
        imported:
          $ref: '#/components/schemas/EhImportedCounts'
        cookies:
          $ref: '#/components/schemas/EhCookieImportResult'
        skipped:
          type: integer
          description: Gid conflicts skipped (or whole rows rejected)

    # ----------------------------------------------------------
    # Jobs (统一后台任务, plan 2026-08-06)
    # ----------------------------------------------------------
    JobType:
      type: string
      enum: [IMPORT, EXPORT, RESTORE, CACHE_CLEAR]
      description: Background job type (A2)

    JobState:
      type: string
      enum: [PENDING, RUNNING, COMPLETED, FAILED]
      description: Background job lifecycle state (A2)

    JobDto:
      type: object
      required: [jobId, type, state]
      description: Unified background job state (A1 schema)
      properties:
        jobId:
          type: string
          description: Job identifier (job-xxxxxxxx)
        type:
          $ref: '#/components/schemas/JobType'
        state:
          $ref: '#/components/schemas/JobState'
        stage:
          type: string
          nullable: true
          description: Current worker stage label (A4); null before the worker starts
        percent:
          type: number
          format: double
          description: 'processed/total × 100, computed by the worker (0 when total = 0)'
        processed:
          type: integer
          description: Work units processed so far
        total:
          type: integer
          description: Total work units
        startedAt:
          type: integer
          format: int64
          nullable: true
          description: Start timestamp (ms epoch); null before the worker starts
        completedAt:
          type: integer
          format: int64
          nullable: true
          description: Completion timestamp (ms epoch); null until COMPLETED/FAILED
        error:
          type: string
          nullable: true
          description: Error message when state = FAILED
        result:
          type: object
          nullable: true
          description: >-
            Terminal result, shaped by type (A1): IMPORT → EhImportResponse;
            EXPORT → {downloadUrl: "/api/v1/backup/export/{jobId}",
            filename: "anotherviewer-backup-<stamp>.zip", sizeBytes};
            RESTORE → {success, message}; CACHE_CLEAR → {removed, total}

    JobSubmitResponse:
      type: object
      required: [jobId, state]
      description: 202 response body of the async job submit endpoints (A2)
      properties:
        jobId:
          type: string
        state:
          $ref: '#/components/schemas/JobState'

    ApiErrorEnvelope:
      type: object
      description: >-
        M-6 error envelope used by all /api/v1 errors (A2):
        {error: {code, message, traceId, status}}. The machine-readable code
        distinguishes the error — e.g. CONFLICT (409, an active job of the same
        type already exists), JOB_NOT_FOUND (404), NO_ACTIVE_JOB (404),
        EXPORT_NOT_FOUND (404), EXPORT_NOT_READY (409).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, status]
          properties:
            code:
              type: string
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
            traceId:
              type: string
              nullable: true
              description: Request trace identifier (when available)
            status:
              type: integer
              description: HTTP status code

