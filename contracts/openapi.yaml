    RecycleItem:
      type: object
      description: One tombstone row shown in the recycle bin (v4, ADR-0006 D4). Retention = RECYCLE_RETENTION_DAYS (7) counted from the tombstone's server-stamped lastModified. ehSession tombstones never appear here (purged silently).
      required: [entity, key, title, deletedAt, remainingDays]
      properties:
        entity:
          type: string
          enum: [favorites, history, downloads, bookmarks, filters, quickSearches, downloadLabels]
          description: Entity type of the deleted record
        key:
          type: string
          description: Entity idempotency key (sync-conflict-rules §2), serialized as a string
        title:
          type: string
          nullable: true
          description: Human-readable display title of the deleted record; null when the row has no displayable title
        deletedAt:
          type: integer
          format: int64
          description: Epoch ms when the row was tombstoned — equals the tombstone row's server-stamped lastModified (retention clock starts here)
        remainingDays:
          type: integer
          description: Whole days remaining before the entry becomes purge-eligible; 0 = expiring

    RecycleListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecycleItem'
        total:
          type: integer
          format: int64
          description: Total entries matching the filter (across all pages)
        page:
          type: integer
          description: Echoed zero-based page index
        pageSize:
          type: integer
          description: Echoed (clamped) page size

    RecycleRestoreRequest:
      type: object
      description: Body of POST /api/v1/recycle/restore — entries to restore, addressed by entity type + idempotency key.
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [entity, key]
            properties:
              entity:
                type: string
                enum: [favorites, history, downloads, bookmarks, filters, quickSearches, downloadLabels]
              key:
                type: string
                description: Entity idempotency key (sync-conflict-rules §2), serialized as a string

    RecycleRestoreResponse:
      type: object
      description: Result of POST /api/v1/recycle/restore.
      required: [restored, failed]
      properties:
        restored:
          type: integer
          description: Number of entries successfully restored (deleted=false + fresh server stamp)
        failed:
          type: integer
          description: Number of requested entries that could not be restored (already purged / unknown key)

    RecyclePurgeRequest:
      type: object
      description: Body of POST /api/v1/recycle/purge. Optional — omit to purge all expired entries (RECYCLE_RETENTION_DAYS elapsed). Download files move to <dataDir>/trash for a further 7 days (ADR-0006 D5).
      properties:
        items:
          type: array
          description: Specific entries to purge (including not-yet-expired ones); omit = purge all expired
          items:
            type: object
            required: [entity, key]
            properties:
              entity:
                type: string
                enum: [favorites, history, downloads, bookmarks, filters, quickSearches, downloadLabels]
              key:
                type: string
                description: Entity idempotency key (sync-conflict-rules §2), serialized as a string

    RecyclePurgeResponse:
      type: object
      description: Result of POST /api/v1/recycle/purge.
      required: [purged]
      properties:
