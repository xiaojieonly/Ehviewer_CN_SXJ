  # ============================================================
  # Processing
  # ============================================================
  /api/v1/process/gallery/{id}:
    post:
      tags: [Processing]
      operationId: triggerGalleryProcessing
      summary: Trigger AI image enhancement for all pages of a gallery
      description: |
        Enqueues all pages of the gallery for background AI enhancement (e.g. waifu2x upscale/denoise).
        Returns a task ID that can be used to query progress.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Gallery ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessingRequest'
      responses:
        '200':
          description: Processing task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingTaskResponse'
        '404':
          description: Gallery not found
        '409':
          description: Processing already in progress for this gallery

  /api/v1/process/status/{taskId}:
    get:
      tags: [Processing]
      operationId: getProcessingStatus
      summary: Query the progress of an image processing task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
          description: Task ID returned by triggerGalleryProcessing
      responses:
        '200':
