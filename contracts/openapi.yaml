  /api/v1/proxy/test:
    post:
      tags: [Settings]
      operationId: testProxy
      summary: Test connectivity to Gallery Site through a proxy (saved settings when no body)
      description: |
        With no body the currently saved proxy settings are used; with a body
        the given values are tested (all fields optional, merged over the
        saved settings), so the admin UI can validate a form before saving it.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyTestRequest'
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyTestResponse'

  /api/v1/site/proxy:
    get:
      tags: [Gallery]
      operationId: proxySite
      summary: Transparent Gallery Site proxy for App Tier-2 browsing (W3 R4-13)
      description: |
        Fetches `url` through the server's shared site session (cookies/proxy
        inherited) and passes status, content-type and body straight through.
        The host must be e-hentai.org, exhentai.org, ehgt.org, or a
        subdomain of these — anything else is rejected, so the endpoint is not
        an open proxy. An unreachable site
        surfaces 502 (E2E-6: errors are passed through, never fabricated).
        App Tier-2 routing rewrites site-family requests here (ADR-0003 D3).
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: Absolute Gallery Site URL to fetch (host-whitelisted)
      responses:
        '200':
          description: Site response passed through (content-type and body preserved)
          content:
            text/html:
              schema:
                type: string
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: url missing/malformed or host outside the Gallery Site whitelist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Gallery Site unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Gallery]
      operationId: proxySitePost
      summary: POST form of the transparent Gallery Site proxy (App EH API calls)
      description: |
        Same host whitelist and pass-through semantics as GET /site/proxy, but
        forwards a request body verbatim: the App's EH API calls (api.php,
        e.g. `{"method":"showpage",...}` JSON) arrive here. The body bytes and
        the request `Content-Type` header are forwarded unchanged (missing
        header defaults to `application/json; charset=utf-8`); the site
        Referer/Origin headers are rebuilt exactly like the GET path so
        api.php accepts the request. The upstream response status,
        content-type and body are passed straight back (bounded read — an
        oversized upstream body surfaces 502 code=UPSTREAM_TOO_LARGE).
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: Absolute Gallery Site URL to fetch (host-whitelisted)
        - name: Content-Type
          in: header
          required: false
          schema:
            type: string
          description: >-
            Forwarded verbatim as the upstream request media type;
            defaults to application/json; charset=utf-8 when absent
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Site response passed through (upstream status/content-type/body preserved)
          content:
            application/json:
              schema:
                type: string
            text/html:
              schema:
                type: string
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: url missing/malformed or host outside the Gallery Site whitelist (code=VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Gallery Site unreachable (code=BAD_GATEWAY) or upstream body over the size limit (code=UPSTREAM_TOO_LARGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # Preferences (per-user UI preferences)
  # ============================================================
  /api/v1/preferences:
    get:
      tags: [Settings]
