openapi: 3.0.3
info:
  title: AnotherViewer WebUI Backend API
  description: |
    REST API for the AnotherViewer WebUI backend (Spring Boot).

    Authentication: all endpoints under /api/v1 require a bearer token
    (Authorization: Bearer <token>) except the publicly permitted ones
    (auth/register, auth/login, auth/status, auth/pair/complete, health,
    metrics, metrics/dashboard, GET site/availability) and non-API
    resources.
  version: 1.1.0
  contact:
    name: AnotherViewer WebUI Team

servers:
  - url: http://localhost:8080
    description: Local development server

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Authentication and session management
  - name: Gallery
    description: Gallery search, detail, history, favorites, quick search
  - name: Favorite
    description: Remote favorites management (Gallery Site server-side)
  - name: History
    description: Local browsing history
  - name: Download
    description: Download task management and labels
  - name: Comment
    description: Gallery comments
  - name: Settings
    description: Server settings
  - name: Image
    description: Image proxy and streaming
  - name: Cache
    description: Cache statistics and management
  - name: Processing
    description: Image enhancement processing pipeline
  - name: Sync
    description: Android-Server sync protocol
  - name: Archive
    description: Gallery archive download
  - name: Torrent
    description: Gallery torrent download
  - name: SMB
    description: SMB network backup and sync
  - name: Backup
    description: Local backup export/restore (zip of slices + manifest.json)
  - name: Jobs
    description: Unified background jobs (admin operations async-ified, plan 2026-08-06)
  - name: Health
    description: Health check and metrics
  - name: Privacy
    description: Server-side content-mask switch state (admin advanced settings)
  - name: Integrity
    description: Download file integrity (peer hash evidence, page repair, reverify, scrub report)

paths:
  # ============================================================
  # Auth
  # ============================================================
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Registration failed (e.g. username taken, validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          description: Registration is disabled on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate and obtain a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/v1/auth/status:
    get:
      tags: [Auth]
      operationId: getAuthStatus
      summary: Check current authentication status
      security: []
      parameters:
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: "Bearer token (e.g. 'Bearer <token>')"
      responses:
        '200':
          description: Auth status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'

  /api/v1/auth/pair:
    post:
      tags: [Auth]
      operationId: generatePairCode
      summary: Generate a short-lived single-use pairing code for device pairing
      responses:
        '200':
          description: Pairing code generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairCodeResponse'
        '401':
          description: Authentication required

  /api/v1/auth/pair/start:
    post:
      tags: [Auth]
      operationId: generatePairCodeStart
      summary: Alias for POST /pair (openapi client compatibility)
      responses:
        '200':
          description: Pairing code generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairCodeResponse'
        '401':
          description: Authentication required

  /api/v1/auth/pair/complete:
    post:
      tags: [Auth]
      operationId: completePairing
      summary: Exchange a pairing code for a device-scoped bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairCompleteRequest'
      responses:
        '200':
          description: Device paired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairCompleteResponse'
        '400':
          description: Invalid or expired pairing code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairCompleteResponse'

  /api/v1/auth/register-device:
    post:
      tags: [Auth]
      operationId: registerDevice
      summary: >-
        Auto-pair a device without a pairing code (LAN single-user mode).
        Allowed while `security.auto_pairing` is enabled on the server;
        otherwise rejected with 400 so clients fall back to /pair/complete.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '200':
          description: Device registered, bearer token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairCompleteResponse'
        '400':
          description: Auto-pairing disabled or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairCompleteResponse'
        '409':
          description: Setup key required but not provided

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Invalidate the current session token
      parameters:
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: "Bearer token to invalidate"
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Authentication required (token missing or invalid)

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the WebUI account password (auth mode must be enabled)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: "Wrong old password, invalid new password length, or auth disabled"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Authentication required (token missing or invalid)

  /api/v1/auth/eh-login:
    post:
      tags: [Auth]
      operationId: ehLogin
      summary: Sign in to the Gallery Site (EH) via the shared cookie store
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Gallery Site login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Gallery Site login failed (invalid credentials or site unreachable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/v1/auth/eh-logout:
    post:
      tags: [Auth]
      operationId: ehLogout
      summary: Sign out of the Gallery Site session only (the WebUI token is kept)
      responses:
        '200':
          description: Gallery Site session cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Authentication required (token missing or invalid)

  /api/v1/auth/eh-session:
    get:
      tags: [Auth]
      operationId: ehSession
      summary: Report the current Gallery Site session and its identity cookies
      responses:
        '200':
          description: Gallery Site session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EhSessionResponse'
        '401':
          description: Authentication required (token missing or invalid)

  /api/v1/auth/eh-site:
    put:
      tags: [Auth]
      operationId: setEhSite
      summary: Switch the Gallery Site used by all site traffic (0 = e-hentai, 1 = exhentai)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EhSiteRequest'
      responses:
        '200':
          description: Gallery Site switched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid gallery site value (must be 0 or 1) or missing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Authentication required (token missing or invalid)

  # ============================================================
  # Gallery
  # ============================================================
  /api/v1/gallery/search:
    get:
      tags: [Gallery]
      operationId: searchGallery
      summary: Search galleries with keyword, category filter, and pagination
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: Search keyword
        - name: category
          in: query
          required: false
          schema:
            type: integer
          description: Category bitmask filter
        - name: sort
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2, 3]
            default: 0
          description: >-
            Sort order (v1.1+): 0/absent = default order, 1 = posted time desc,
            2 = rating desc, 3 = title asc. Passed through to the site URL as
            f_order.
        - name: pageMin
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Minimum page count (site params f_sp=on&f_spf=N); absent = no bound
        - name: pageMax
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Maximum page count (site params f_sp=on&f_spt=N); absent = no bound
        - name: minRating
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 5
          description: Minimum rating threshold (site params f_sr=on&f_srdd=N); 0/absent = disabled
        - name: searchName
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "Advanced search scope (advsearch=1&f_sname=on): match gallery name"
        - name: searchTags
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "Advanced search scope (advsearch=1&f_stags=on): match tags"
        - name: searchDesc
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "Advanced search scope (advsearch=1&f_sdesc=on): match description"
        - name: searchTorrents
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "Advanced search scope (advsearch=1&f_storr=on): match torrent filenames"
        # W3 R4-10 — higher AdvanceSearchTable bits (backendized so the WebUI
        # single filter surface can express the full Android option set).
        - name: searchTorrentsOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "Advanced option (advsearch=1&f_sto=on): only show galleries with torrents"
        - name: searchLowPowerTags
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "Advanced option (advsearch=1&f_sdt1=on): also match low-power tags"
        - name: searchDownvotedTags
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "Advanced option (advsearch=1&f_sdt2=on): also match downvoted tags"
        - name: searchExpunged
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "Advanced option (advsearch=1&f_sh=on): include expunged galleries"
        - name: disableLanguageFilter
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "Advanced option (advsearch=1&f_sfl=on): disable the default language filter"
        - name: disableUploaderFilter
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "Advanced option (advsearch=1&f_sfu=on): disable the default uploader filter"
        - name: disableTagFilter
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "Advanced option (advsearch=1&f_sft=on): disable the default tag filter"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Page number (0-based)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Number of results per page
      responses:
        '200':
          description: >-
            Gallery list. When the Gallery Site is circuit-broken, returns
            success=false, empty data, total=0 and cause="EH_UNAVAILABLE"
            (no upstream I/O; see /api/v1/site/availability).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryListResponse'

  /api/v1/gallery/feed:
    get:
      tags: [Gallery]
      operationId: galleryFeed
      summary: >-
        Gallery feed by mode: subscription (watched), popular (what's hot), or
        toplist (EH top lists)
      parameters:
        - name: mode
          in: query
          required: true
          schema:
            type: string
            enum: [subscription, popular, toplist]
          description: >-
            Feed kind. subscription = watched galleries, popular = what's hot,
            toplist = EH top list (first non-empty time slot, yesterday first).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Page number (0-based); used by subscription/popular only
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Number of results per page (clamped to 1..200)
      responses:
        '200':
          description: >-
            subscription/popular return GalleryListResponse (identical to
            GET /gallery/search); toplist returns TopListResponse. An
            unreachable site surfaces success=false with empty data and
            total 0 (E2E-6, same as /search); when the site is
            circuit-broken the response additionally carries
            cause="EH_UNAVAILABLE".
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GalleryListResponse'
                  - $ref: '#/components/schemas/TopListResponse'
        '400':
          description: Invalid or missing mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedErrorResponse'

  /api/v1/gallery/{gid}:
    get:
      tags: [Gallery]
      operationId: getGalleryDetail
      summary: Get full detail for a single gallery
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Gallery ID
      responses:
        '200':
          description: Gallery detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryDetailDto'
        '404':
          description: Gallery not found

  /api/v1/gallery/history/{gid}:
    post:
      tags: [Gallery]
      operationId: addToHistory
      summary: Record a gallery visit into history
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToHistoryRequest'
      responses:
        '200':
          description: Success flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/gallery/quick-search:
    get:
      tags: [Gallery]
      operationId: getQuickSearches
      summary: List saved quick search presets
      responses:
        '200':
          description: Quick search list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickSearchListResponse'
    post:
      tags: [Gallery]
      operationId: createQuickSearch
      summary: Create a new quick search preset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickSearchDto'
      responses:
        '200':
          description: Created quick search
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickSearchDto'

  /api/v1/gallery/quick-search/{id}:
    delete:
      tags: [Gallery]
      operationId: deleteQuickSearch
      summary: Delete a quick search preset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ============================================================
  # Favorite (remote Gallery Site favorites)
  # ============================================================
  /api/v1/favorite/list:
    get:
      tags: [Favorite]
      operationId: listFavorites
      summary: List favorites from a specific slot with pagination
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Favorite folder slot (0-9)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number (1-based)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
          description: >-
            Number of favorites per page (W3-F4b). The controller clamps the
            value into 1..200 — the same window as /api/v1/history/list
            (FavoriteService itself only clamps the lower bound; its default
            20 applies to direct service callers, not this endpoint).
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
          description: >-
            Case-insensitive title/titleJpn LIKE substring search (A5d).
            Blank/absent = no filter.
        - name: regex
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            When true, `q` is interpreted as a regular expression (A5d); an
            invalid pattern → 400 REGEX_INVALID. Absent/false = LIKE
            substring match.
      responses:
        '200':
          description: Favorite list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteListResponse'
        '400':
          description: 'Invalid regex in q (code=REGEX_INVALID)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/favorite/add:
    post:
      tags: [Favorite]
      operationId: addFavorite
      summary: Add a gallery to favorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteAddRequest'
      responses:
        '200':
          description: Success flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/v1/favorite/remove:
    delete:
      tags: [Favorite]
      operationId: removeFavorite
      summary: Remove a gallery from favorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteRemoveRequest'
      responses:
        '200':
          description: Success flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ============================================================
  # History (dedicated controller)
  # ============================================================
  /api/v1/history/list:
    get:
      tags: [History]
      operationId: listHistory
      summary: List browsing history entries (optionally filtered, A5d)
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Page number (0-based)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Number of entries per page
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
          description: >-
            Case-insensitive title/titleJpn LIKE substring search (A5d).
            Blank/absent = no filter.
        - name: regex
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            When true, `q` is interpreted as a regular expression (A5d); an
            invalid pattern → 400 REGEX_INVALID. Absent/false = LIKE
            substring match. Any non-blank q/regex runs the filter over the
            full history set in memory (no DB LIKE path).
      responses:
        '200':
          description: History list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryListResponse'
        '400':
          description: 'Invalid regex in q (code=REGEX_INVALID)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/history/clear:
    delete:
      tags: [History]
      operationId: clearHistory
      summary: Clear all browsing history
      responses:
        '200':
          description: Success flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ============================================================
  # Download
  # ============================================================
  /api/v1/download/slots:
    get:
      tags: [Download]
      operationId: listFilterSlots
      summary: List the configured filter slots (named regex presets, A5d)
      description: |
        A filter slot is a named regex preset (`{id, name, pattern}`) stored
        in the serverConfig KV `download.filterSlots` (JSON array, exported
        with backups). The download / favorite / history list pages share the
        same slot set: selecting one filters the list by its pattern.
        Unconfigured server → empty `slots` array.
      responses:
        '200':
          description: Filter slot list (empty array when none configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterSlotsResponse'
    put:
      tags: [Download]
      operationId: updateFilterSlots
      summary: Replace the whole filter slot list (A5d)
      description: |
        Whole-list replacement (no partial update). Validation: at most 20
        slots, non-empty name (≤32 chars), non-empty regex pattern (≤256
        chars) that compiles. Any violation → 400 VALIDATION_ERROR with the
        M-6 envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterSlotsRequest'
      responses:
        '200':
          description: Echo of the stored slot list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterSlotsResponse'
        '400':
          description: 'Validation failed (code=VALIDATION_ERROR)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/download/list:
    get:
      tags: [Download]
      operationId: listDownloads
      summary: List download tasks, optionally filtered by label (server-side pagination, A5)
      parameters:
        - name: label
          in: query
          required: false
          schema:
            type: integer
          description: Label ID filter (0/absent = all)
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Pagination offset (default 0)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          description: Page size (default 100; the server clamps limit to [1, 500])
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [time_desc, time_asc, title_asc, title_desc]
            default: time_desc
          description: >-
            Sort mode (default `time_desc` = add time newest-first; unknown
            values fall back to the default). `time_*` sorts by the add-time
            column, `title_*` sorts by the gallery title.
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
          description: >-
            Server-side case-insensitive search over title / titleJpn
            (LIKE match; the load stays on the server). Blank/absent = no
            filter.
        - name: regex
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            When true, `q` is interpreted as a regular expression and matched
            server-side against title / titleJpn (A5). An invalid pattern →
            400 REGEX_INVALID. Absent/false = LIKE substring match.
      responses:
        '200':
          description: Download list with labels and total count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadListResponse'
        '400':
          description: 'Invalid regex in q (code=REGEX_INVALID)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

