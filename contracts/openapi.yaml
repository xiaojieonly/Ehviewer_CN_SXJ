          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceResponse'
        '401':
          description: Authentication required

  # ============================================================
  # Privacy (server-side content-mask switch)
  # ============================================================
  /api/v1/privacy/mask:
    get:
      tags: [Privacy]
      operationId: getPrivacyMask
      summary: Get the server-side content-mask ("privacy mask") switch state
      description: |
        Authoritative server state of the single content-mask switch. When
        enabled, the PrivacyMaskFilter redacts content-class JSON responses
        server-side, so headless clients (agents, sync) only ever receive
        masked data. The WebUI persists its toggle here so every client
        shares one state; there is no separate per-client redaction switch.
      responses:
        '200':
          description: Current mask state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyMaskResponse'
    post:
      tags: [Privacy]
      operationId: setPrivacyMask
      summary: Set the server-side content-mask switch
      description: |
        Persists the switch in serverConfig; takes effect immediately on the
        response path (masking is applied per response at emission time).
        Returns the new state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyMaskRequest'
      responses:
        '200':
          description: Echo of the persisted mask state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyMaskResponse'

  # ============================================================
  # Image (existing proxy + new streaming)
  # ============================================================
  /api/v1/image/proxy:
    get:
      tags: [Image]
      operationId: proxyImage
      summary: Proxy and cache an image by its original URL (W3 R4-13 fetch-on-miss)
      description: |
        URL-keyed cache lookup. On a miss for a Gallery Site URL
        (e-hentai.org / exhentai.org / ehgt.org family) the image is fetched
        through the server's shared site session (cookies/proxy inherited), backfilled
        into the cache and served with the site's content-type. Non-site
        hosts are never fetched; an unreachable or erroring site keeps the
        404 error envelope (E2E-6: errors pass through, never fabricated).
        Backs the Tier-2 thumbnail rewrite (W3 #13).
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: Original image URL to proxy
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: |
            Conditional request header (RFC 7232, weak comparison). Evaluated
            on the cache-hit paths (scaled `w=` hit or original hit) — a hit
            returns 304 without any upstream request. A cache miss always
            fetches upstream (the fresh response still carries the headers
            for later revalidation).
      responses:
        '200':
          description: Image binary data (cache hit, or fetch-on-miss with the site content-type)
          headers:
            Cache-Control:
              schema:
                type: string
              description: "Always 'public, max-age=86400'"
            ETag:
              schema:
                type: string
              description: >-
                Weak validator derived from the ImageCacheService cache key:
                `W/"<sha256(url)>"` for the original bytes, `W/"thumb:w{n}:<url>"`
                for `w=` scaled variants (each variant has its own ETag).
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '304':
          description: >-
            Not Modified — the request's If-None-Match matched the current
            ETag on a cache-hit path. Empty body; carries the current `ETag`
            and `Cache-Control` headers. Never triggers an upstream request.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                description: "Always 'public, max-age=86400'"
        '404':
          description: >-
            Not in cache and not fetchable (non-whitelisted host, site
            unreachable, or site error). When the site is circuit-broken
            (code=EH_UNAVAILABLE, message states "仅显示本地内容") the handler
            short-circuits without any network I/O.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/image/cache/status:
    get:
      tags: [Image]
      operationId: getImageCacheStatus
      summary: Get image cache size information
      responses:
        '200':
          description: Cache status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageCacheStatus'

  /api/v1/image/cache/clear:
    post:
      tags: [Image]
      operationId: clearImageCache
      summary: Clear all cached proxy images asynchronously (CACHE_CLEAR job)
      description: |
        Submits a CACHE_CLEAR background job (202); progress is pushed on
        /topic/jobs/{jobId} and /topic/jobs/all (A3) and the terminal result is
        {removed, total}.
      responses:
        '202':
          description: Cache-clear job submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '409':
          description: 'Another CACHE_CLEAR job is already active (code=CONFLICT)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/image/{galleryId}/{page}:
    get:
      tags: [Image]
      operationId: streamGalleryImage
      summary: Stream a single gallery page image with on-demand fetching and caching
      description: |
        Returns the image for a specific page of a gallery. On cache miss, the server
        fetches the image via the core parser, caches it, and returns it.
        Supports HTTP Range requests for partial content (206) and unsatisfiable
        ranges (416). When `enhanced=1` is set, the AI-enhanced variant is served
        from the processing output directory if it exists (404 otherwise).
      parameters:
        - name: galleryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Gallery ID
        - name: page
          in: path
          required: true
          schema:
            type: integer
            format: int32
          description: Page number (0-based)
        - name: w
          in: query
          required: false
          schema:
            type: integer
            format: int32
          description: |
            Accepted for client compatibility; currently ignored by the server
            (the original resolution is always returned).
        - name: enhanced
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
            default: 0
          description: If 1, return the AI-enhanced version (if processed); otherwise return original
        - name: Range
          in: header
          required: false
          schema:
            type: string
          description: |
            HTTP Range header for partial content (e.g. "bytes=0-1023").
            If-Range is NOT supported: the server never validates a Range
            request against If-Range (RFC 7233 §3.2) — a Range request is
            always answered with 206 regardless of any validator mismatch.
            Clients wanting conditional behavior must use If-None-Match
            (evaluated before Range) instead.
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: |
            Conditional request header (RFC 7232, weak comparison: `*`,
            comma lists, `W/` prefix are handled). Evaluated BEFORE the Range
            header and only when the page is served from the storage pool
            (App-pushed download): a hit returns 304 without reading the file,
            acquiring the pool-read gate, or triggering page prefetch.
            Takes precedence over Range.
      responses:
        '200':
          description: Full image
          headers:
            Content-Type:
              schema:
                type: string
              description: MIME type of the image (image/jpeg, image/png, image/webp, image/gif)
            Accept-Ranges:
              schema:
                type: string
              description: "Always 'bytes'"
            Cache-Control:
              schema:
                type: string
              description: "max-age=86400"
            ETag:
              schema:
                type: string
              description: >-
                Present only when the page is served from the storage pool
                (App-pushed download). Strong validator `"sha256:<hash>"`
                when a page_file_hash baseline exists (a baseline refresh /
                heal naturally invalidates old client validators), otherwise
                weak `W/"<size>-<mtime>"` of the pool file. Other serve paths
                (cache hit, enhanced variant, upstream fetch) currently omit it.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '206':
          description: >-
            Partial content (Range request). If-Range is not supported: Range
            is served without consulting If-Range (see the Range parameter).
          headers:
            Content-Range:
              schema:
                type: string
              description: "Range specifier (e.g. 'bytes 0-1023/4096')"
            Content-Type:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
              description: "Always 'bytes'"
            Cache-Control:
              schema:
                type: string
              description: "max-age=86400"
            ETag:
              schema:
                type: string
              description: Same conditional semantics as the 200 response (storage-pool serve path only).
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '304':
          description: >-
            Not Modified — the request's If-None-Match matched the current
            pool-page ETag (evaluated before the Range header; an unsatisfied
            If-None-Match falls through to the normal 200/206 handling).
            Empty body; the file is not read, the storage-pool read gate is
            not acquired, and no page prefetch is scheduled. A baseline
            refresh (heal) changes the hash and naturally invalidates old
            client validators (subsequent conditional requests get 200).
          headers:
            ETag:
              schema:
                type: string
              description: "Strong '\"sha256:<hash>\"' (baseline exists) or weak 'W/\"<size>-<mtime>\"'"
            Cache-Control:
              schema:
                type: string
                description: "max-age=86400"
        '401':
          description: Gallery Site session expired or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '404':
          description: >-
            Gallery or page not found (or enhanced variant not processed).
            When the site is circuit-broken (code=EH_UNAVAILABLE, message
            states "仅显示本地内容") the handler short-circuits before any
            upstream fetch — only pushed/local file misses may still serve
            local content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageErrorResponse'
        '416':
          description: Range not satisfiable
          headers:
            Content-Range:
              schema:
                type: string
              description: "bytes */<size>"
        '429':
          description: Rate limited (concurrent fetch limit for this gallery reached)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageErrorResponse'

  # ============================================================
  # Cache
  # ============================================================
  /api/v1/cache/stats:
    get:
      tags: [Cache]
      operationId: getCacheStats
      summary: Get cache usage statistics
      description: Returns disk and memory cache usage including size, entry count, and hit rates.
      responses:
        '200':
          description: Cache statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheStats'

  /api/v1/cache/gallery/{id}:
    delete:
      tags: [Cache]
      operationId: clearGalleryCache
      summary: Clear all cached images for a specific gallery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Gallery ID
      responses:
        '200':
          description: Success flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Gallery not found in cache

  # ============================================================
  # Processing
  # ============================================================
  /api/v1/process/gallery/{id}:
    post:
      tags: [Processing]
      operationId: triggerGalleryProcessing
      summary: Trigger AI image enhancement for all pages of a gallery
      description: |
        Enqueues all pages of the gallery for background AI enhancement (e.g. waifu2x upscale/denoise).
        Returns a task ID that can be used to query progress.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Gallery ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessingRequest'
      responses:
        '200':
          description: Processing task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingTaskResponse'
        '404':
          description: Gallery not found
        '409':
          description: Processing already in progress for this gallery

  /api/v1/process/status/{taskId}:
    get:
      tags: [Processing]
      operationId: getProcessingStatus
      summary: Query the progress of an image processing task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
          description: Task ID returned by triggerGalleryProcessing
      responses:
        '200':
          description: Processing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingStatus'
        '404':
          description: Task not found

  /api/v1/process/cancel/{taskId}:
    post:
      tags: [Processing]
      operationId: cancelProcessing
      summary: Request cancellation of an image processing task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
          description: Task ID returned by triggerGalleryProcessing
      responses:
        '200':
          description: Cancel request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Task not found

  /api/v1/process/tasks:
    get:
      tags: [Processing]
      operationId: getProcessingTasks
      summary: List processing tasks (active snapshot or recent mixed list)
      description: |
        With `active=1`, returns the in-memory active tasks only (PENDING/
        PROCESSING, including transient progress). Without the parameter,
        returns the most recent 200 history records from the task store,
        newest first (terminal + active mixed). Both variants share the same
        ProcessingTaskRecordDto shape (handoff §4).
      parameters:
        - name: active
          in: query
          required: false
          schema:
            type: string
            enum: ["1"]
          description: Set to 1 to return only the in-memory active tasks
      responses:
        '200':
          description: Processing task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingTaskListResponse'

  /api/v1/process/history:
    get:
      tags: [Processing]
      operationId: getProcessingHistory
      summary: Paged processing task history (newest first)
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
          description: Zero-based page index
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 500
          description: Page size, clamped server-side to 1..500 (D13)
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, PROCESSING, DONE, FAILED]
          description: Optional task-state filter
      responses:
        '200':
          description: History page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingHistoryResponse'
        '400':
          description: Invalid query parameter (e.g. unknown state)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/process/retry/{taskId}:
    post:
      tags: [Processing]
      operationId: retryProcessing
      summary: Retry a failed or cancelled processing task
      description: |
        Re-submits the original task's parameters for its failed pages only
        (page-level dedup exemption, D8) and returns the newly created task.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
          description: Task ID of the failed task to retry
      responses:
        '200':
          description: New processing task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingTaskResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '409':
          description: Task is not in a retryable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  # ============================================================
  # Sync
  # ============================================================
  /api/v1/sync/push:
    post:
      tags: [Sync]
      operationId: syncPush
      summary: Push client changes to the server
      description: |
        Receives a batch of client entities wrapped in a SyncEntityCollection
        (favorites, history, downloads, bookmarks, filters, quick searches,
        download labels, preferences). Entities are merged server-side using
        per-entity strategies; tombstones are conveyed via `deleted` flags.
        The returned serverTimestamp should be used as the base for the next
        pull.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Push result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '401':
          description: Invalid or missing API token

  /api/v1/sync/pull:
    get:
      tags: [Sync]
      operationId: syncPull
      summary: Pull server changes since a given timestamp
      description: |
        Returns all server-side changes that occurred after the given
        timestamp, wrapped in a SyncEntityCollection. The client should store
        the returned serverTimestamp for the next pull.
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: Unix timestamp (milliseconds) — return changes after this time
        - name: deviceId
          in: query
          required: false
          schema:
            type: string
          description: Client device ID (used to exclude the requesting device's own changes)
      responses:
        '200':
          description: Server changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        '401':
          description: Invalid or missing API token

  /api/v1/sync/status:
    get:
      tags: [Sync]
      operationId: getSyncStatus
      summary: Get current sync status, connected devices, and entity counts
      responses:
        '200':
          description: Sync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusResponse'
        '401':
          description: Invalid or missing API token

  /api/v1/sync/devices:
    get:
      tags: [Sync]
      operationId: listDevices
      summary: List paired devices
      responses:
        '200':
          description: Paired device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceInfoDto'
        '401':
          description: Invalid or missing API token

  /api/v1/sync/devices/{deviceId}:
    delete:
      tags: [Sync]
      operationId: revokeDevice
      summary: Revoke a paired device and invalidate its token
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Invalid or missing API token
        '403':
          description: Device not found or not owned by this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sync/policy:
    get:
      tags: [Sync]
      operationId: getSyncPolicy
      summary: Get the current sync policy (ADR-0003, sync-conflict-rules v2 §8)
      responses:
        '200':
          description: Current policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPolicy'
        '401':
          description: Invalid or missing API token
    put:
      tags: [Sync]
      operationId: updateSyncPolicy
      summary: Update the sync policy (WebUI may change; the next android push carrying policy overrides it, D2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPolicy'
      responses:
        '200':
          description: Persisted policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPolicy'
        '400':
          description: Validation error (unknown strategy / out-of-range tier or interval)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or missing API token

  # ============================================================
  # Recycle Bin (v4, ADR-0006 D4)
  # ============================================================
  /api/v1/recycle/list:
    get:
      tags: [Sync]
      operationId: listRecycleBin
      summary: List recycle bin entries (tombstones within the 7-day retention window, ADR-0006 D4)
      description: |
        Paged listing of deleted records retained in the recycle bin
        (RECYCLE_RETENTION_DAYS = 7, counted from the tombstone row's
        server-stamped lastModified). Scope: favorites, history, downloads,
        bookmarks, filters, quickSearches, downloadLabels; ehSession tombstones
        never enter the recycle bin (sync-conflict-rules v4 §9).
      parameters:
        - name: entity
          in: query
          required: false
          schema:
            type: string
            enum: [favorites, history, downloads, bookmarks, filters, quickSearches, downloadLabels]
          description: Filter by entity type (omit = all recyclable types)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Zero-based page index
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
          description: Page size (clamped by the server)
      responses:
        '200':
          description: Recycle bin page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecycleListResponse'
        '401':
          description: Invalid or missing API token

  /api/v1/recycle/restore:
    post:
      tags: [Sync]
      operationId: restoreRecycleItems
      summary: Restore recycle bin entries (deleted=false + fresh server stamp; propagates as an ordinary LWW record)
      description: |
        Sets each requested tombstone row back to deleted=false and stamps it
        with a fresh server timestamp, so the restore propagates to all devices
        through the ordinary LWW merge (ADR-0006 D4; sync-conflict-rules v4 §9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecycleRestoreRequest'
      responses:
        '200':
          description: Restore result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecycleRestoreResponse'
        '401':
          description: Invalid or missing API token

  /api/v1/recycle/purge:
    post:
      tags: [Sync]
      operationId: purgeRecycleItems
      summary: Hard-delete recycle bin entries (default = all expired)
      description: |
        Permanently purges tombstone rows. With no request body, every entry
        whose RECYCLE_RETENTION_DAYS (7) has elapsed is purged; download files
        of purged entries move to <dataDir>/trash for a further 7 days
        (ADR-0006 D5). ehSession tombstones are purged silently (never listed).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecyclePurgeRequest'
      responses:
        '200':
          description: Purge result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecyclePurgeResponse'
        '401':
          description: Invalid or missing API token

  # ============================================================
  # Backup (local zip export/restore, R4-5)
  # ============================================================
  /api/v1/backup/export:
    get:
      tags: [Backup]
      operationId: exportBackup
      summary: Export a backup zip (slices + manifest.json), also persisted under <dataDir>/backups/
      parameters:
        - name: includeDownloads
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include the downloads slice in the backup
      responses:
        '200':
          description: Backup zip stream (anotherviewer-backup-<yyyyMMdd-HHmmss>.zip)
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: Invalid or missing API token

  /api/v1/backup/export/async:
    post:
      tags: [Backup]
      operationId: exportBackupAsync
      summary: Start an asynchronous backup export job (EXPORT, B3)
      description: |
        Asynchronous variant of GET /api/v1/backup/export: the export runs in
        the background; when the job reaches COMPLETED the zip is fetched with
        GET /api/v1/backup/export/{jobId}. The synchronous GET
        /api/v1/backup/export remains for compatibility (A2).
      parameters:
        - name: includeDownloads
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include the downloads slice in the backup
      responses:
        '202':
          description: Export job submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '401':
          description: Invalid or missing API token
        '409':
          description: 'Another EXPORT job is already active (code=CONFLICT)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/backup/export/{jobId}:
    get:
      tags: [Backup]
      operationId: downloadExport
      summary: Download the backup zip produced by an EXPORT job (COMPLETED only)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
          description: Job ID returned by POST /api/v1/backup/export/async
      responses:
        '200':
          description: Backup zip stream (anotherviewer-backup-<stamp>.zip)
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: Invalid or missing API token
        '404':
          description: 'Unknown job (code=EXPORT_NOT_FOUND)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '409':
          description: 'Export job not COMPLETED yet (code=EXPORT_NOT_READY)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/backup/restore:
    post:
      tags: [Backup]
      operationId: restoreBackup
      summary: Upload a backup zip and restore asynchronously (RESTORE job, B3)
      description: |
        Submits a RESTORE background job (per-slice SHA-256 verified inside the
        worker); 202 returns the job handle. On completion the runtime state is
        set as before (GET /api/v1/backup/state → restorePending=true) and a
        server restart is required for the restored data to take effect (R4-2).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Backup zip produced by /backup/export
      responses:
        '202':
          description: Restore job submitted (completion result mirrors BackupRestoreResponse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '400':
          description: Restore failed (empty file / missing manifest.json / bad slice checksum / path traversal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or missing API token
        '409':
          description: 'Another RESTORE job is already active (code=CONFLICT)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/backup/state:
    get:
      tags: [Backup]
      operationId: getBackupState
      summary: Restore runtime-awareness state (R4-2); restorePending=true means a restore succeeded and a server restart is required to take effect
      responses:
        '200':
          description: Current backup/restore runtime state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupStateResponse'
        '401':
          description: Invalid or missing API token

  /api/v1/backup/import-ehviewer:
    post:
      tags: [Backup]
      operationId: importEhViewer
      summary: Import an original EhViewer backup db (optional cookies db/JSON) into local user data as an IMPORT job (B3)
      description: |
        Table-driven scan of the uploaded sqlite export; known tables are mapped
        per-table, gid conflicts are skipped unless force=true (upsert). Optional
        cookies file accepts an okhttp3-cookie.db or an equivalent JSON array;
        only gallery-site domain cookies are imported.

        Breaking change (B3): the previous synchronous 200 EhImportResponse is
        replaced by 202 JobSubmitResponse; poll GET /api/v1/jobs/{jobId} (or
        re-attach via GET /api/v1/jobs/active?type=IMPORT). The per-table counts
        arrive as the JobDto.result (EhImportResponse shape) on completion.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: EhViewer export db (anotherviewer.db)
                cookies:
                  type: string
                  format: binary
                  description: Optional okhttp3-cookie.db or cookie JSON array
                force:
                  type: boolean
                  default: false
                  description: Upsert on gid conflicts instead of skipping
      responses:
        '202':
          description: Import job submitted (per-table counts arrive as JobDto.result on completion)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '400':
          description: Import failed (empty file / unreadable db / import error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or missing API token
        '409':
          description: 'Another IMPORT job is already active (code=CONFLICT)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  # ============================================================
  # Jobs (统一后台任务, plan 2026-08-06)
  # ============================================================
  /api/v1/jobs/{jobId}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get the current state of a background job (polling + refresh re-attach)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
          description: Job ID returned by the async submit endpoints
      responses:
        '200':
          description: Job state (PENDING/RUNNING/COMPLETED/FAILED with progress and terminal result)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDto'
        '401':
          description: Invalid or missing API token
        '404':
          description: 'Unknown job (code=JOB_NOT_FOUND)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/jobs/active:
    get:
      tags: [Jobs]
      operationId: getActiveJob
      summary: Get the active job of a given type (re-attach after refresh/reconnect)
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/JobType'
          description: Job type filter
      responses:
        '200':
          description: Active job (PENDING/RUNNING) of the requested type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDto'
        '401':
          description: Invalid or missing API token
        '404':
          description: 'No active job of the requested type (code=NO_ACTIVE_JOB)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  # ============================================================
  # Archive
  # ============================================================
  /api/v1/archive/list/{gid}:
    get:
      tags: [Archive]
      operationId: listArchives
      summary: List available archive downloads for a gallery
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Archive list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveListResponse'

  /api/v1/archive/download:
    post:
      tags: [Archive]
      operationId: downloadArchive
      summary: Start downloading a gallery archive
      description: |
        200 `{success:true, path:"<gid>/"}` on success (path is a relative hint;
        absolute server paths are never exposed);
        400 `{success:false, message}` when the archive URL host is not allowed
        (SSRF guard);
        502 `{success:false, message}` when the archiver flow failed (credits
        required, upstream error).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveDownloadRequest'
      responses:
        '200':
          description: Archive download initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveDownloadResponse'
        '400':
          description: Archive URL host not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveDownloadResponse'
        '502':
          description: Archive download failed (credits required or upstream error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveDownloadResponse'

  # ============================================================
  # Torrent
  # ============================================================
  /api/v1/torrent/list/{gid}:
    get:
      tags: [Torrent]
      operationId: listTorrents
      summary: List available torrents for a gallery
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Torrent list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TorrentListResponse'

  /api/v1/torrent/download:
    get:
      tags: [Torrent]
      operationId: downloadTorrent
      summary: Download a torrent file by token
      description: |
        The `token` is a URL (typically an Gallery Site torrent page URL). Returns
        the raw `.torrent` file bytes as an `application/x-bittorrent`
        attachment (Content-Disposition `attachment; filename=<gid>.torrent`).
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Torrent download token (URL)
      responses:
        '200':
          description: Torrent file bytes
          headers:
            Content-Type:
              schema:
                type: string
              description: application/x-bittorrent
            Content-Disposition:
              schema:
                type: string
              description: "attachment; filename=<gid>.torrent"
          content:
            application/x-bittorrent:
              schema:
                type: string
                format: binary
        '404':
          description: Torrent file unavailable (host not allowed, fetch failed, or no file)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # SMB
  # ============================================================
  /api/v1/smb/config:
    get:
      tags: [SMB]
      operationId: getSmbConfig
      summary: Get current SMB backup configuration
      responses:
        '200':
          description: SMB config (may be null if never configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmbConfigResponse'
    put:
      tags: [SMB]
      operationId: updateSmbConfig
      summary: Create or update SMB backup configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmbConfigUpdateRequest'
      responses:
        '200':
          description: Whether the update succeeded
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/smb/test-connection:
    post:
      tags: [SMB]
      operationId: testSmbConnection
      summary: Test connectivity to an SMB share
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmbTestConnectionRequest'
      responses:
        '200':
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmbTestConnectionResponse'

  /api/v1/smb/sync:
    post:
      tags: [SMB]
      operationId: startSmbSync
      summary: Start an SMB backup sync operation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmbSyncRequest'
      responses:
        '200':
          description: Whether the sync was started
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/smb/cancel:
    post:
      tags: [SMB]
      operationId: cancelSmbSync
      summary: Cancel an in-progress SMB sync
      responses:
        '200':
          description: Whether the cancel succeeded
          content:
            application/json:
              schema:
                type: boolean

  /api/v1/smb/progress:
    get:
      tags: [SMB]
      operationId: getSmbProgress
      summary: Get current SMB sync progress
      responses:
        '200':
          description: Sync progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmbSyncProgress'

  # ============================================================
  # Health
  # ============================================================
  /api/v1/health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Server health check
      security: []
      description: Returns overall server health including subsystem status.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Server is degraded or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/site/availability:
    get:
      tags: [Health]
      operationId: getSiteAvailability
      summary: Get the Gallery Site availability state (read-only, no probe)
      security: []
      description: |
        Process-level availability state machine of the Gallery Site
        (EH circuit breaker, plan 2026-08-30). Read-only: never performs a
        network probe. `DOWN` = upstream requests are short-circuited
        (automatic upstream traffic returns 404 EH_UNAVAILABLE);
        `UP` = reachable; `UNKNOWN` = not yet probed since startup.
        The `galleryApi` component of /api/v1/health reports this state.
      responses:
        '200':
          description: Availability state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityStatus'
    post:
      tags: [Health]
      operationId: probeSiteAvailability
      summary: Trigger a single manual Gallery Site probe (manual recovery)
      description: |
        Executes one probe attempt against the Gallery Site (single-flight,
        5s timeout) and returns the resulting state. Success restores UP;
        failure keeps DOWN. The only recovery path — there is no automatic
        probe or TTL-based recheck. Manual/user-triggered action only.
      responses:
        '200':
          description: Availability state after the manual probe completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityStatus'
        '401':
          description: Authentication required

  /api/v1/metrics:
    get:
      tags: [Health]
      operationId: getMetrics
      summary: Get flat server metrics
      security: []
      description: |
        Returns operational metrics as flat fields (uptime, JVM memory, active
        downloads, processing queue, cache usage). A legacy `metrics` map with
        per-metric `MetricValue` entries is retained for backward
        compatibility with existing consumers.
      responses:
        '200':
          description: Server metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'

  /api/v1/metrics/dashboard:
    get:
      tags: [Health]
      operationId: getDashboard
      summary: Get a structured dashboard snapshot
      security: []
      responses:
        '200':
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'

  # ============================================================
  # Integrity (download file integrity: peer hash evidence, page
  # repair, full re-verification, scrub report)
  # ============================================================
  /api/v1/integrity/hashes/{gid}:
    post:
      tags: [Integrity]
      operationId: pushIntegrityHashes
      summary: >-
        Push the App's per-page hashes for a gallery as peer evidence
        (peer_hash); never touches the server's own baseline
      description: |
        Android uploads the per-page hash list it computed for its downloaded
        page files during sync. The server stores the entries as peer evidence
        in the peer_hash table (keyed by gid/page with the uploading device as
        peer); the server's own page_file_hash baseline is never overwritten.
        Later comparisons surface baseline-vs-peer divergences in
        GET /api/v1/integrity/report. Repeated pushes for the same gid/page
        upsert the peer evidence.
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Gallery ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/IntegrityHashEntry'
      responses:
        '200':
          description: >-
            Entries accepted and stored as peer evidence. An empty list is a
            no-op (accepted=0).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityHashAcceptResponse'
        '400':
          description: >-
            Invalid payload (malformed hex digest or unsupported algo)
            (code=INTEGRITY_INVALID_HASH)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '401':
          description: Invalid or missing API token

  /api/v1/integrity/refresh/{gid}/{page}:
    post:
      tags: [Integrity]
      operationId: repairIntegrityPage
      summary: >-
        Force-heal one page: fetch from source bypassing the local pool,
        verify, overwrite, refresh the baseline, clear the page cache
      description: |
        Single-page forced repair. The page is fetched from the Gallery Site
        bypassing the local pool, validated (V gate), the local file is
        overwritten, the hash baseline is refreshed with origin=heal, and the
        page cache is cleared. The outcome is returned synchronously;
        attribution is diagnostic (log semantics) but included so maintenance
        UIs can display it. On failure the local file is left untouched.
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Gallery ID
        - name: page
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based page number
      responses:
        '200':
          description: >-
            Repair attempt finished. Both outcomes ride 200: status=healed on
            success, status=failed (with attribution + message) when the
            source fetch or V-gate verification did not produce a valid file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairResult'
        '400':
          description: 'Invalid page number (code=INTEGRITY_INVALID_PAGE)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '401':
          description: Invalid or missing API token
        '404':
          description: 'No local download row or page file for this gid+page (code=INTEGRITY_NOT_FOUND)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/integrity/reverify/{gid}:
    post:
      tags: [Integrity]
      operationId: reverifyIntegrityGallery
      summary: Start (or interrupt) a full per-page re-verification of one gallery (REVERIFY job)
      description: |
        Aligned with the unified background-job mode (plan 2026-08-06). A call
        without a body (or interrupt=false) submits a REVERIFY job that
        re-reads every page file on disk, hashes it and compares against the
        baseline. Progress is polled via GET /api/v1/jobs/{jobId}
        (processed/total = pages); the final ReverifyStats arrive as
        JobDto.result on COMPLETED. One active job per type (same as
        EXPORT/IMPORT/RESTORE): re-submitting while a REVERIFY job is active
        is rejected with 409 CONFLICT. The run is idempotent and re-entrant:
        a finished run can be restarted at any time, and verification never
        mutates the baseline (only origin=heal refreshes do).

        Interrupt: POST again with {"interrupt": true} to set the cooperative
        stop flag on the active REVERIFY job (regardless of the gid path
        parameter — jobs are single-instance per type). The run finishes the
        current page and completes with partial ReverifyStats
        (interrupted=true) at state=COMPLETED, not FAILED. When no REVERIFY
        job is active, the interrupt call returns 404
        (code=NO_ACTIVE_JOB).
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Gallery ID to re-verify
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverifyRequest'
      responses:
        '202':
          description: >-
            REVERIFY job accepted (start) or interrupt flag delivered
            (interrupt). Poll GET /api/v1/jobs/{jobId}; the stats land as
            JobDto.result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '401':
          description: Invalid or missing API token
        '404':
          description: >-
            No local download row for this gid (code=INTEGRITY_NOT_FOUND), or
            interrupt requested while no REVERIFY job is active
            (code=NO_ACTIVE_JOB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '409':
          description: 'Another REVERIFY job is already active (code=CONFLICT)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/integrity/scrub:
    post:
      tags: [Integrity]
      operationId: triggerIntegrityScrub
      summary: Manually trigger a full-library integrity scrub (admin endpoint)
      description: |
        Enqueues one StorageIntegrityService scrub run on a background thread
        and returns immediately. The run re-reads page files, verifies them
        against the baseline (verdict ok/struct_bad), performs the zero-network
        baseline-vs-peer cross audit and writes a scrub_run row that surfaces
        in GET /api/v1/integrity/report. A scheduled monthly cron shares the
        same single-flight guard: while a scrub (manual or scheduled) is
        running, a second trigger is rejected with 409 CONFLICT.
      responses:
        '202':
          description: Scrub accepted and started in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityScrubTriggerResponse'
        '401':
          description: Invalid or missing API token
        '409':
          description: 'A scrub is already running (code=CONFLICT)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/integrity/backfill:
    post:
      tags: [Integrity]
      operationId: backfillIntegrity
      summary: Synchronously run one TOFU maintenance action for a single gallery (admin endpoint)
      description: |
        Triggers the Wave 2 (S4) maintenance actions synchronously for ONE
        gallery (the request thread performs the work, so gid is mandatory —
        full-library scans are reserved for the operator CLI / checkpointed
        runs). Two kinds are defined:

        - "hashes": TOFU hash backfill — walks the gallery's page files on
          disk (one selection per page via the shared duplicate-page rule),
          V-gates and SHA-256 hashes each, and creates page_file_hash baseline
          rows with origin=import. Existing (gid,page) rows are NEVER
          overwritten (trust-on-first-use), structurally invalid files land a
          verdict=struct_bad row with an empty hash. Reads are rate limited to
          the current storage profile's scrub rate (SSD 400 / HDD 60 / ZFS
          120 MB/s).
        - "pageCounts": disk page-count backfill — recounts the page files on
          disk (deduplicated by page number across 4- and 8-digit names) and
          corrects download_info.pages, additionally completing legacy
          state=WAIT rows with total=0 to state=FINISHED (total=done=disk
          count). Rows whose disk directory is missing or empty are never
          touched.

        With dryRun=true both kinds only report what would change and write
        nothing (no rows, no checkpoint KV).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrityBackfillRequest'
      responses:
        '200':
          description: >-
            Maintenance action finished synchronously; the payload is the
            stats of the requested kind (hashes → IntegrityBackfillStats,
            pageCounts → IntegrityApplyPageCountsStats)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IntegrityBackfillStats'
                  - $ref: '#/components/schemas/IntegrityApplyPageCountsStats'
        '400':
          description: >-
            Missing gid or unknown kind (code=VALIDATION_ERROR); gid is
            mandatory to keep the request thread off full-library scans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '401':
          description: Invalid or missing API token
        '404':
          description: 'No local download row for this gid (code=INTEGRITY_NOT_FOUND)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/integrity/report:
    get:
      tags: [Integrity]
      operationId: getIntegrityReport
      summary: Latest integrity report (last scrub run, bad pages, baseline-vs-peer divergences)
      description: |
        Snapshot of the most recent monthly scrub run and its findings. The
        page/pageSize parameters slice the badPages and divergences lists
        independently (each list carries its own unfiltered total); the run
        summary is never paginated. When no scrub has run yet, lastRun is
        null and both lists are empty.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Page number (0-based), applied to badPages and divergences
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Results per page, clamped to 1..200, applied to both lists
      responses:
        '200':
          description: Integrity report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityReport'
        '401':
          description: Invalid or missing API token

# ==============================================================
# Components
# ==============================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Bearer token issued by /api/v1/auth/login, /api/v1/auth/register, or /api/v1/auth/pair/complete"
  schemas:
    # ----------------------------------------------------------
    # Auth
    # ----------------------------------------------------------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          description: Current password
        newPassword:
          type: string
          minLength: 6
          maxLength: 72
          description: New password (BCrypt truncates beyond 72 bytes)

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        token:
          type: string
          nullable: true
        username:
          type: string
          nullable: true

    AuthStatusResponse:
      type: object
      properties:
        authenticated:
          type: boolean
          description: Whether a local WebUI account token was supplied and is valid
        username:
          type: string
          nullable: true
        authRequired:
          type: boolean
          description: Whether the server enforces authentication for API access
        ehSessionValid:
          type: boolean
          description: Whether the Gallery Site session (cookie store) is valid
        ehSessionExpired:
          type: boolean
          description: Whether the Gallery Site session has expired and needs re-authentication

    EhSessionResponse:
      type: object
      properties:
        signedIn:
          type: boolean
          description: Whether Gallery Site identity cookies are present
        expired:
          type: boolean
          description: Whether the Gallery Site session has expired and needs re-authentication
        gallerySite:
          type: integer
          default: 0
          description: Selected Gallery Site (0 = e-hentai, 1 = exhentai)
        cookies:
          type: array
          items:
            $ref: '#/components/schemas/EhSessionCookieDto'

    EhSiteRequest:
      type: object
      required: [gallerySite]
      properties:
        gallerySite:
          type: integer
          minimum: 0
          maximum: 1
          description: Target Gallery Site (0 = e-hentai, 1 = exhentai)

    EhSessionCookieDto:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        domain:
          type: string
        expiresAt:
          type: integer
          format: int64
          description: Cookie expiry timestamp (ms epoch); 253402300799999 for cookies without an explicit expiry

    PairCodeResponse:
      type: object
      properties:
        code:
          type: string
          description: Six-character alphanumeric pairing code
        expiresAt:
          type: integer
          format: int64
          description: Expiry timestamp (ms epoch)

    PairCompleteRequest:
      type: object
      required: [code, deviceId, deviceName]
      properties:
        code:
          type: string
        deviceId:
          type: string
        deviceName:
          type: string
        platform:
          type: string
          default: android

    RegisterDeviceRequest:
      type: object
      required: [deviceId, deviceName]
      properties:
        deviceId:
          type: string
          description: Stable per-install id (e.g. android-<uuid>)
        deviceName:
          type: string
        platform:
          type: string
          default: android
        setupKey:
          type: string
          nullable: true
          description: Optional static setup key when the server requires one

    PairCompleteResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        token:
          type: string
        username:
          type: string
          nullable: true

    DeviceInfoDto:
      type: object
      properties:
        deviceId:
          type: string
        deviceName:
          type: string
        platform:
          type: string
        pairedAt:
          type: integer
          format: int64
        lastSeen:
          type: integer
          format: int64

    # ----------------------------------------------------------
    # Gallery
    # ----------------------------------------------------------
    GalleryListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/GalleryItemDto'
        total:
          type: integer
        cause:
          type: string
          enum: [EH_UNAVAILABLE]
          nullable: true
          description: >-
            Optional failure cause; "EH_UNAVAILABLE" when the Gallery Site is
            circuit-broken and the list is empty (success=false, total=0).
            Absent/null on success or plain errors.

    GalleryItemDto:
      type: object
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        galleryUrl:
          type: string
          readOnly: true
        title:
          type: string
          nullable: true
        titleJpn:
          type: string
          nullable: true
        thumb:
          type: string
          nullable: true
        category:
          type: integer
        posted:
          type: string
          nullable: true
        uploader:
          type: string
          nullable: true
        rating:
          type: number
          format: float
        rated:
          type: boolean
        simpleLanguage:
          type: string
          nullable: true
        simpleTags:
          type: array
          items:
            type: string
        thumbWidth:
          type: integer
        thumbHeight:
          type: integer
        pages:
          type: integer
        favoriteSlot:
          type: integer
        favoriteName:
          type: string
          nullable: true
        readProgress:
          type: integer
          minimum: 0
          nullable: true
          description: >-
            0-based last-read page index from the history row (reading
            progress, additive). Absent/null when no progress is known
            (legacy servers or upstream-fetched rows without local history).

    TopListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/TopListFeedItemDto'
        total:
          type: integer
        cause:
          type: string
          enum: [EH_UNAVAILABLE]
          nullable: true
          description: >-
            Optional failure cause; "EH_UNAVAILABLE" when the Gallery Site is
            circuit-broken and the list is empty (success=false, total=0).
            Absent/null on success or plain errors.

    TopListFeedItemDto:
      type: object
      properties:
        gid:
          type: string
          nullable: true
        token:
          type: string
          nullable: true
        tag:
          type: string
          nullable: true
        value:
          type: string
          nullable: true
        href:
          type: string
          nullable: true

    FeedErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

    GalleryDetailDto:
      type: object
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        galleryUrl:
          type: string
          readOnly: true
        title:
          type: string
          nullable: true
        titleJpn:
          type: string
          nullable: true
        thumb:
          type: string
          nullable: true
        category:
          type: integer
        posted:
          type: string
          nullable: true
        uploader:
          type: string
          nullable: true
        rating:
          type: number
          format: float
        rated:
          type: boolean
        simpleLanguage:
          type: string
          nullable: true
        simpleTags:
          type: array
          items:
            type: string
        thumbWidth:
          type: integer
        thumbHeight:
          type: integer
        pages:
          type: integer
        favoriteSlot:
          type: integer
        favoriteName:
          type: string
          nullable: true
        readProgress:
          type: integer
          minimum: 0
          nullable: true
          description: >-
            0-based last-read page index from the history row (reading
            progress, additive). Absent/null when no progress is known
            (legacy servers or upstream-fetched rows without local history).
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDto'
        imageUrl:
          type: string
          nullable: true
        cause:
          type: string
          enum: [EH_UNAVAILABLE]
          nullable: true
          description: >-
            Optional failure cause; "EH_UNAVAILABLE" when the Gallery Site is
            circuit-broken and the detail could not be enriched from upstream.
            Absent/null otherwise.

    TagDto:
      type: object
      properties:
        namespace:
          type: string
          nullable: true
        tag:
          type: string

    AddToHistoryRequest:
      type: object
      properties:
        token:
          type: string
        title:
          type: string
          nullable: true
        page:
          type: integer
          minimum: 0
          description: >-
            0-based reading position to persist with the history row
            (additive). Optional: when absent the server keeps the stored
            progress (legacy clients push no page); an explicit 0 is written
            as-is and means "re-reading from the start".

    QuickSearchListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/QuickSearchDto'

    QuickSearchDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        mode:
          type: integer
        category:
          type: integer
        keyword:
          type: string
          nullable: true
        advanceSearch:
          type: integer
        minRating:
          type: integer
        pageFrom:
          type: integer
        pageTo:
          type: integer
        sort:
          type: integer
          enum: [0, 1, 2, 3]
          default: 0
          description: >-
            Sort order persisted with the preset (W3 R4-11; same semantics as
            GET /api/v1/gallery/search `sort`): 0 = default order,
            1 = posted time desc, 2 = rating desc, 3 = title asc. Applied
            when the preset is loaded. Absent on legacy rows (reads as 0).
            REST-only: SyncQuickSearchDto (app schema) intentionally has no
            sort — presets keep it when stored via REST, the app ignores it.

    # ----------------------------------------------------------
    # Favorite
    # ----------------------------------------------------------
    FavoriteListResponse:
      type: object
      properties:
        favorites:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteItem'
        totalPages:
          type: integer
        currentPage:
          type: integer
        page:
          type: integer
          description: >-
            Echoed 1-based page number (W2-B2 envelope extension, backward
            compatible — legacy clients ignore it). Equal to `currentPage`.
        pageSize:
          type: integer
          description: >-
            Effective page size (W2-B2 envelope extension; the listFavorites
            controller defaults it to 50 and clamps the request value into
            1..200).
        total:
          type: integer
          description: >-
            Total live rows matching the slot/q filter, paging excluded
            (W2-B2 envelope extension) — the authoritative count for
            client-side pagination.

    FavoriteItem:
      type: object
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        title:
          type: string
        titleJpn:
          type: string
        thumb:
          type: string
        category:
          type: integer
          description: Gallery category bitmask
        rating:
          type: number
          format: float
        uploader:
          type: string
          nullable: true
        posted:
          type: string
          nullable: true
        readProgress:
          type: integer
          minimum: 0
          nullable: true
          description: 阅读进度（0 起页索引，来自同 gid 历史行）；无历史行为 null，0/null 不显示角标

    FavoriteAddRequest:
      type: object
      required: [gid, token, category]
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        category:
          type: integer

    FavoriteRemoveRequest:
      type: object
      required: [gid, token, category]
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        category:
          type: integer

    # ----------------------------------------------------------
    # History
    # ----------------------------------------------------------
    HistoryListResponse:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'

    HistoryItem:
      type: object
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        title:
          type: string
        titleJpn:
          type: string
        thumb:
          type: string
        category:
          type: integer
          description: Gallery category bitmask
        rating:
          type: number
          format: float
        mode:
          type: integer
        time:
          type: integer
          format: int64
        page:
          type: integer
          minimum: 0
          description: >-
            0-based last-read page index (reading progress; additive, optional
            for legacy servers that do not persist progress yet).

    # ----------------------------------------------------------
    # Download
    # ----------------------------------------------------------
    FilterSlotDto:
      type: object
      required: [id, name, pattern]
      description: A named regex preset (筛选槽位, A5d).
      properties:
        id:
          type: string
          description: Stable slot identifier (uuid), referenced by the list pages
        name:
          type: string
          maxLength: 32
          description: Display name (non-empty)
        pattern:
          type: string
          maxLength: 256
          description: Regex pattern the list filter is matched against (must compile)

    FilterSlotsRequest:
      type: object
      required: [slots]
      description: Whole-list replacement for PUT /api/v1/download/slots (A5d).
      properties:
        slots:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/FilterSlotDto'
          description: Replacement slot list (≤ 20 entries)

    FilterSlotsResponse:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          items:
            $ref: '#/components/schemas/FilterSlotDto'
          description: Stored slot list (empty array when none configured)

    DownloadListResponse:
      type: object
      properties:
        downloads:
          type: array
          items:
            $ref: '#/components/schemas/DownloadItem'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/DownloadLabel'
        total:
          type: integer
          description: Total rows under the current label filter, counted before pagination (A5)

    DownloadItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        gid:
          type: integer
          format: int64
        token:
          type: string
        title:
          type: string
          nullable: true
        titleJpn:
          type: string
          nullable: true
        thumb:
          type: string
          nullable: true
        category:
          type: integer
        state:
          type: integer
          description: "Download state: 0=NONE/pending, 1=WAIT, 2=DOWNLOADING, 3=FINISHED, 4=FAILED"
        total:
          type: integer
        done:
          type: integer
        label:
          type: integer
        downloadDir:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
          description: Human-readable failure/cancel reason (null when the task has not failed)

    DownloadLabel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        time:
          type: integer
          format: int64

    MaintenanceFileIssue:
      type: object
      description: Unreferenced entry under the downloads root (W2-DL F2).
      required: [path, sizeBytes]
      properties:
        path:
          type: string
          description: Entry name relative to the downloads root
        sizeBytes:
          type: integer
          format: int64
          description: Total bytes of the entry (computed before any deletion)

    MaintenanceDownloadIssue:
      type: object
      description: FINISHED download row whose local content is missing/corrupt (W2-DL F2).
      required: [id, gid, title, reason]
      properties:
        id:
          type: integer
          format: int64
        gid:
          type: integer
          format: int64
        title:
          type: string
          nullable: true
        reason:
          type: string
          enum: [content_dir_missing, no_usable_page_files]

    MaintenancePreviewResponse:
      type: object
      description: Dry-run scan result for GET /api/v1/download/maintenance/preview.
      required: [redundantFiles, invalidDownloads]
      properties:
        redundantFiles:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceFileIssue'
        invalidDownloads:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceDownloadIssue'

    MaintenanceKind:
      type: string
      description: Which maintenance cleanup to execute.
      enum: [REDUNDANT_FILES, INVALID_DOWNLOADS]

    MaintenanceCleanRequest:
      type: object
      description: Body for POST /api/v1/download/maintenance/clean.
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/MaintenanceKind'

    MaintenanceCleanResponse:
      type: object
      description: Actual outcome of POST /api/v1/download/maintenance/clean.
      required: [kind, removedFiles, removedDownloads, freedBytes]
      properties:
        kind:
          $ref: '#/components/schemas/MaintenanceKind'
        removedFiles:
          type: integer
          description: Deleted redundant entries (REDUNDANT_FILES branch)
        removedDownloads:
          type: integer
          description: Deleted invalid download rows (INVALID_DOWNLOADS branch)
        freedBytes:
          type: integer
          format: int64
          description: Disk bytes reclaimed (measured before deletion)

    DownloadAddRequest:
      type: object
      required: [gid, token]
      properties:
        gid:
          type: integer
          format: int64
        token:
          type: string
        title:
          type: string
          nullable: true
        thumb:
          type: string
          nullable: true
        label:
          type: integer
          default: 0

    DownloadUploadInitRequest:
      type: object
      description: >-
        Metadata for an App-pushed download. Creates the row when missing or
        updates it when `force` is set; a non-force push over an existing row
        is rejected so server-side downloads are never clobbered.
      required: [token]
      properties:
        token:
          type: string
        title:
          type: string
          nullable: true
        titleJpn:
          type: string
          nullable: true
        thumb:
          type: string
          nullable: true
        category:
          type: integer
        uploader:
          type: string
          nullable: true
        rating:
          type: number
          format: float
        simpleTags:
          type: string
          nullable: true
        pages:
          type: integer
        label:
          type: integer
          default: 0
        force:
          type: boolean
          default: false
          description: Overwrite an existing server-side download row for the same gid

    DownloadUploadInitResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        existingPages:
          type: array
          items:
            type: integer
          description: Page numbers already present (1-based), for resume

    DownloadUploadCompleteRequest:
      type: object
      description: Page totals reported by the App after the final page upload.
      required: [total]
      properties:
        total:
          type: integer
          description: Total page count reported by the App
        done:
          type: integer
          default: 0

    DownloadLabelRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string

    DownloadRangeRequest:
      type: object
      description: >-
        Batch target. `all=true` ignores ids and resolves the whole set
        server-side using the (label, q, regex) filters (cross-page
        select-all).
      properties:
        ids:
          type: array
          maxItems: 500
          items:
            type: integer
            format: int64
          description: Explicit id list (required when all=false)
        all:
          type: boolean
          default: false
          description: Act on the full filtered set instead of ids
        label:
          type: integer
          description: Label filter for all-mode (0/absent = every label)
        q:
          type: string
          maxLength: 256
          description: Title search filter for all-mode (absent = every entry)
        regex:
          type: boolean
          default: false
          description: >-
            Regex mode for the all-mode `q` filter (A5): when true, `q` is
            interpreted as a regular expression; an invalid pattern → 400
            REGEX_INVALID. Absent/false = LIKE substring match.

    DownloadMoveRequest:
      type: object
      description: Move batch — same target semantics as DownloadRangeRequest.
      properties:
        ids:
          type: array
          maxItems: 500
          items:
            type: integer
            format: int64
          description: Explicit id list (required when all=false)
        all:
          type: boolean
          default: false
        label:
          type: integer
          description: Label filter for all-mode (0/absent = every label)
        q:
          type: string
          maxLength: 256
          description: Title search filter for all-mode (absent = every entry)
        regex:
          type: boolean
          default: false
          description: >-
            Regex mode for the all-mode `q` filter (A5): when true, `q` is
            interpreted as a regular expression; an invalid pattern → 400
            REGEX_INVALID. Absent/false = LIKE substring match.
        labelId:
          type: integer
          minimum: 0
          default: 0
          description: Target label id (0 = move back to the default label)

    DownloadProgress:
      type: object
      properties:
        gid:
          type: integer
          format: int64
        state:
          type: integer
        downloaded:
          type: integer
        total:
          type: integer
        speed:
          type: integer
          format: int64
        label:
          type: integer

    # ----------------------------------------------------------
    # Comment
    # ----------------------------------------------------------
    CommentListResponse:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentItem'

    CommentItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uploader:
          type: string
        comment:
          type: string
        time:
          type: string
        score:
          type: integer

    CommentPostRequest:
      type: object
      required: [gid, comment]
      properties:
        gid:
          type: integer
          format: int64
        comment:
          type: string

    CommentVoteRequest:
      type: object
      required: [gid, commentId, vote]
      properties:
        gid:
          type: integer
          format: int64
        commentId:
          type: integer
          format: int64
        vote:
          type: integer
          description: "1 for upvote, -1 for downvote"

    # ----------------------------------------------------------
    # Settings
    # ----------------------------------------------------------
    SettingsResponse:
      type: object
      properties:
        download:
          $ref: '#/components/schemas/DownloadSettings'
        cache:
          $ref: '#/components/schemas/CacheSettings'
        smb:
          $ref: '#/components/schemas/SmbSettings'
        security:
          $ref: '#/components/schemas/SecuritySettings'
        processing:
          $ref: '#/components/schemas/ProcessingSettings'
        proxy:
          $ref: '#/components/schemas/ProxySettings'

    DownloadSettings:
      type: object
      properties:
        path:
          type: string
        downloadDelay:
          type: integer
        downloadTimeout:
          type: integer
          format: int64
        maxConcurrentGalleries:
          type: integer
        maxConcurrentImages:
          type: integer

    CacheSettings:
      type: object
      properties:
        path:
          type: string
        sizeMb:
          type: integer
          format: int64

    SmbSettings:
      type: object
      properties:
        enabled:
          type: boolean

    SettingsUpdateRequest:
      type: object
      properties:
        download:
          $ref: '#/components/schemas/DownloadSettings'
        cache:
          $ref: '#/components/schemas/CacheSettings'
        smb:
          $ref: '#/components/schemas/SmbSettings'
        security:
          $ref: '#/components/schemas/SecuritySettings'
        processing:
          $ref: '#/components/schemas/ProcessingSettings'
        proxy:
          $ref: '#/components/schemas/ProxySettings'

    SecuritySettings:
      type: object
      properties:
        requireAuth:
          type: boolean
        sessionTimeout:
          type: integer
          format: int64

    ProcessingSettings:
      type: object
      properties:
        enabled:
          type: boolean
        defaultType:
          type: string
        outputFormat:
          type: string
        outputQuality:
          type: integer
        entrypointUrl:
          type: string
          description: Base URL of the EntryPoint inference service (image processing backend)
        entrypointToken:
          type: string
          description: Write-only; empty/absent keeps the stored token, which is never returned
        entrypointTokenSet:
          type: boolean
          description: Whether an EntryPoint API token is currently stored on the server
        automationEnabled:
          type: boolean
          description: Trigger processing automatically when a download finishes
        periodicEnabled:
          type: boolean
          description: Periodically scan downloaded galleries and process not-yet-enhanced pages
        periodicIntervalMinutes:
          type: integer
          minimum: 15
          maximum: 10080
          default: 60

    ProxySettings:
      type: object
      properties:
        enabled:
          type: boolean
        type:
          type: string
          enum: [http, socks5]
          default: http
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
          description: Empty string unless a password has been set; the stored password is never returned
        proxyPasswordSet:
          type: boolean
          description: Whether a proxy password is currently stored on the server

    # ----------------------------------------------------------
    # Proxy
    # ----------------------------------------------------------
    ProxyTestRequest:
      type: object
      description: All fields optional; omitted fields fall back to the currently saved settings
      properties:
        enabled:
          type: boolean
          nullable: true
        type:
          type: string
          nullable: true
        host:
          type: string
          nullable: true
        port:
          type: integer
          nullable: true
        username:
          type: string
          nullable: true
        password:
          type: string
          nullable: true

    ProxyTestResponse:
      type: object
      properties:
        success:
          type: boolean
          description: True when the proxy returned a successful (or sub-500) response
        latencyMs:
          type: integer
          format: int64
        error:
          type: string
          description: Error message (empty string on success)

    # ----------------------------------------------------------
    # Image
    # ----------------------------------------------------------
    ImageCacheStatus:
      type: object
      properties:
        cacheSize:
          type: integer
          description: Number of entries currently held in the in-memory image cache

    ImageErrorResponse:
      type: object
      properties:
        error:
          type: string
        galleryId:
          type: integer
          format: int64
        page:
          type: integer

    # ----------------------------------------------------------
    # Cache
    # ----------------------------------------------------------
    CacheStats:
      type: object
      properties:
        diskCacheSizeBytes:
          type: integer
          format: int64
          description: Total disk cache size in bytes
        diskCacheMaxBytes:
          type: integer
          format: int64
          description: Configured disk cache capacity in bytes
        memoryCacheEntries:
          type: integer
          description: Number of entries in memory (hot) cache
        memoryCacheMaxEntries:
          type: integer
          description: Configured memory cache entry limit
        hitCount:
          type: integer
          format: int64
          description: Total cache hits since startup
        missCount:
          type: integer
          format: int64
          description: Total cache misses since startup
        hitRate:
          type: number
          format: double
          description: Cache hit rate (0.0 - 1.0)

    # ----------------------------------------------------------
    # Processing
    # ----------------------------------------------------------
    ProcessingRequest:
      type: object
      properties:
        type:
          type: string
          enum: [UPSCALE_2X, UPSCALE_4X, DENOISE, DENOISE_UPSCALE, REMOVE_BG]
          default: UPSCALE_2X
          description: Processing type to apply
        outputFormat:
          type: string
          enum: [png, webp, jpg]
          default: png
          description: Output image format
        quality:
          type: integer
          default: 90
          minimum: 1
          maximum: 100
          description: Output quality (for lossy formats)

    ProcessingTaskResponse:
      type: object
      properties:
        taskId:
          type: string
          description: Unique task identifier for status polling
        galleryId:
          type: integer
          format: int64
        totalPages:
          type: integer
          description: Number of pages enqueued for processing
        state:
          type: string
          enum: [PENDING, PROCESSING, DONE, FAILED]

    ProcessingStatus:
      type: object
      properties:
        taskId:
          type: string
        galleryId:
          type: integer
          format: int64
        state:
          type: string
          enum: [PENDING, PROCESSING, DONE, FAILED]
        totalPages:
          type: integer
        processedPages:
          type: integer
        failedPages:
          type: integer
        currentPage:
          type: integer
          description: Page currently being processed (-1 if idle)
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
          description: Error message if state is FAILED

    ProcessingTaskRecordDto:
      type: object
      description: >-
        JSON mirror of a processing_task row (handoff §3). Active tasks carry
        the same shape with in-memory transient progress. All timestamps are
        epoch milliseconds. Field-for-field identical to the web-frontend
        `ProcessingTaskRecord` interface.
      required: [taskId, galleryId, title, trigger, processingType, state,
        pagesTotal, pagesDone, pagesFailed, sourceDir, outputDir, epTaskIds,
        errorCode, errorMessage, createdAt, startedAt, finishedAt, updatedAt]
      properties:
        taskId:
          type: string
        galleryId:
          type: integer
          format: int64
        title:
          type: string
          description: Gallery title (display only; may be empty)
        trigger:
          type: string
          enum: [MANUAL, DOWNLOAD_AUTO, SCHEDULED]
          description: What submitted the task
        processingType:
          type: string
          enum: [UPSCALE_2X, UPSCALE_4X, DENOISE, DENOISE_UPSCALE, REMOVE_BG]
        state:
          type: string
          enum: [PENDING, PROCESSING, DONE, FAILED]
          description: Cancellation is recorded as FAILED with errorCode (no CANCELLED state)
        pagesTotal:
          type: integer
        pagesDone:
          type: integer
        pagesFailed:
          type: integer
        sourceDir:
          type: string
          description: Absolute input-page directory (display only, D14)
        outputDir:
          type: string
          description: Absolute enhanced-output directory (display only, D14)
        epTaskIds:
          type: array
          items:
            type: string
          description: EntryPoint-side task ids (debugging/traceability)
        errorCode:
          type: string
          description: Machine-readable error code (EP_UNREACHABLE/EP_TIMEOUT/...); empty when none
        errorMessage:
          type: string
          description: Human-readable error message, truncated to 2048 chars (D12)
        createdAt:
          type: integer
          format: int64
          description: Epoch millis
        startedAt:
          type: integer
          format: int64
          description: Epoch millis (0 when not started)
        finishedAt:
          type: integer
          format: int64
          description: Epoch millis (0 when not finished)
        updatedAt:
          type: integer
          format: int64
          description: Epoch millis of the last state migration

    ProcessingTaskListResponse:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/ProcessingTaskRecordDto'

    ProcessingHistoryResponse:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProcessingTaskRecordDto'
        total:
          type: integer
          format: int64
          description: Total number of records matching the filter (across all pages)
        page:
          type: integer
          description: Echoed zero-based page index
        size:
          type: integer
          description: Echoed (clamped) page size

    # ----------------------------------------------------------
    # Sync
    # ----------------------------------------------------------
    SyncPushRequest:
      type: object
      required: [entities, deviceId]
      properties:
        entities:
          $ref: '#/components/schemas/SyncEntityCollection'
        deviceId:
          type: string
          description: ID of the client device performing the push
        timestamp:
          type: integer
          format: int64
          description: >-
            Client's current timestamp (ms epoch). Optional (v2.1): the server
            currently IGNORES this field — conflict resolution uses the server
            receive time, not the client-supplied value. Kept in the schema for
            wire compatibility with existing clients.
        policy:
          allOf:
            - $ref: '#/components/schemas/SyncPolicy'
          description: Optional (v2). Authoritative when the pushing device is android-platform (ADR-0003 D2); web-originated pushes must not carry it.

    SyncPushResponse:
      type: object
      required: [success, serverTimestamp]
      properties:
        success:
          type: boolean
        serverTimestamp:
          type: integer
          format: int64
          description: Server timestamp after applying changes (use as the base for the next pull)
        conflicts:
          type: integer
          description: Number of conflicts resolved (last-write-wins)

    SyncPullResponse:
      type: object
      required: [entities, serverTimestamp]
      properties:
        entities:
          $ref: '#/components/schemas/SyncEntityCollection'
        serverTimestamp:
          type: integer
          format: int64
          description: Current server timestamp (use as 'since' for the next pull)
        policy:
          allOf:
            - $ref: '#/components/schemas/SyncPolicy'
          description: Optional (v2). Current server sync policy; absent on legacy servers → client falls back to lww without error.

    SyncPolicy:
      type: object
      required: [conflictStrategy, clientTier, autoSyncIntervalSec]
      properties:
        conflictStrategy:
          type: string
          enum: [device_priority, lww, web_priority]
          default: lww
          description: >-
            Conflict arbitration strategy (sync-conflict-rules v4 §1.4):
            lww = server-stamped last-write-wins, equal stamps resolve to the
            later-arriving write (default since v4, ADR-0006 D2);
            device_priority / web_priority are retained for legacy deployments
            but not recommended.
        clientTier:
          type: integer
          enum: [0, 1, 2, 3]
          default: 1
          description: "Client behavior tier (D3): 0 independent, 1 sync+streaming, 2 browsing proxied via server, 3 download hosting (deferred)"
        autoSyncIntervalSec:
          type: integer
          minimum: 0
          default: 900
          description: Network-aware auto-sync interval (D4); 0 = trigger on network change only

    BackupRestoreResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
          description: Human-readable result note (e.g. 还原成功，重启后生效)

    BackupStateResponse:
      type: object
      required: [restorePending]
      properties:
        restorePending:
          type: boolean
          description: true = a restore succeeded and a server restart is required to take effect (R4-2); false otherwise (fresh instance / after restart)

    EhImportedCounts:
      type: object
      description: Per-table imported row counts (B3 contract)
      properties:
        downloads:
          type: integer
        history:
          type: integer
        filters:
          type: integer
        quickSearches:
          type: integer
        labels:
          type: integer
        bookmarks:
          type: integer
        favorites:
          type: integer
        dirnames:
          type: integer
        blackList:
          type: integer
        galleryTags:
          type: integer

    EhCookieImportResult:
      type: object
      description: Cookie segment result; siteDomain = cookies on gallery-site domains, imported = actually written to the session cookie store
      properties:
        imported:
          type: integer
        siteDomain:
          type: integer

    EhImportResponse:
      type: object
      required: [success, imported, cookies, skipped]
      properties:
        success:
          type: boolean
        imported:
          $ref: '#/components/schemas/EhImportedCounts'
        cookies:
          $ref: '#/components/schemas/EhCookieImportResult'
        skipped:
          type: integer
          description: Gid conflicts skipped (or whole rows rejected)

    # ----------------------------------------------------------
    # Jobs (统一后台任务, plan 2026-08-06)
    # ----------------------------------------------------------
    JobType:
      type: string
      enum: [IMPORT, EXPORT, RESTORE, CACHE_CLEAR, REVERIFY]
      description: Background job type (A2); REVERIFY added by the download file integrity feature (C1)

    JobState:
      type: string
      enum: [PENDING, RUNNING, COMPLETED, FAILED]
      description: Background job lifecycle state (A2)

    JobDto:
      type: object
      required: [jobId, type, state]
      description: Unified background job state (A1 schema)
      properties:
        jobId:
          type: string
          description: Job identifier (job-xxxxxxxx)
        type:
          $ref: '#/components/schemas/JobType'
        state:
          $ref: '#/components/schemas/JobState'
        stage:
          type: string
          nullable: true
          description: Current worker stage label (A4); null before the worker starts
        percent:
          type: number
          format: double
          description: 'processed/total × 100, computed by the worker (0 when total = 0)'
        processed:
          type: integer
          description: Work units processed so far
        total:
          type: integer
          description: Total work units
        startedAt:
          type: integer
          format: int64
          nullable: true
          description: Start timestamp (ms epoch); null before the worker starts
        completedAt:
          type: integer
          format: int64
          nullable: true
          description: Completion timestamp (ms epoch); null until COMPLETED/FAILED
        error:
          type: string
          nullable: true
          description: Error message when state = FAILED
        result:
          type: object
          nullable: true
          description: >-
            Terminal result, shaped by type (A1): IMPORT → EhImportResponse;
            EXPORT → {downloadUrl: "/api/v1/backup/export/{jobId}",
            filename: "anotherviewer-backup-<stamp>.zip", sizeBytes};
            RESTORE → {success, message}; CACHE_CLEAR → {removed, total};
            REVERIFY → ReverifyStats

    JobSubmitResponse:
      type: object
      required: [jobId, state]
      description: 202 response body of the async job submit endpoints (A2)
      properties:
        jobId:
          type: string
        state:
          $ref: '#/components/schemas/JobState'

    ApiErrorEnvelope:
      type: object
      description: >-
        M-6 error envelope used by all /api/v1 errors (A2):
        {error: {code, message, traceId, status}}. The machine-readable code
        distinguishes the error — e.g. CONFLICT (409, an active job of the same
        type already exists), JOB_NOT_FOUND (404), NO_ACTIVE_JOB (404),
        EXPORT_NOT_FOUND (404), EXPORT_NOT_READY (409).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, status]
          properties:
            code:
              type: string
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
            traceId:
              type: string
              nullable: true
              description: Request trace identifier (when available)
            status:
              type: integer
              description: HTTP status code

