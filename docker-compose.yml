# docker-compose.yml
version: '3.8'
services:
  anotherviewer:
    build: .
    container_name: anotherviewer-web
    ports:
      - "8080:8080"
    volumes:
      # 容器内以 UID 1000（appuser）运行（M-12，见 Dockerfile）；启动时会自动
      # chown 这三个挂载目录。若宿主机目录权限导致写入失败，先执行
      #   sudo chown -R 1000:1000 data cache downloads
      - ./data:/app/data
      - ./cache:/app/cache
      - ./downloads:/app/downloads
    environment:
      - ANOTHERVIEWER_SERVER_PORT=8080
      - ANOTHERVIEWER_DOWNLOAD_PATH=/app/downloads
      - ANOTHERVIEWER_CACHE_PATH=/app/cache
      - ANOTHERVIEWER_CACHE_SIZE_MB=10240
      - ANOTHERVIEWER_DOWNLOAD_WORKER_COUNT=3
      - ANOTHERVIEWER_DB_URL=jdbc:sqlite:/app/data/anotherviewer.db
    restart: unless-stopped
