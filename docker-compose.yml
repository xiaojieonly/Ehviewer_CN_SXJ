# docker-compose.yml
version: '3.8'
services:
  anotherviewer:
    build: .
    container_name: anotherviewer-web
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - ./downloads:/app/downloads
    environment:
      - ANOTHERVIEWER_SERVER_PORT=8080
      - ANOTHERVIEWER_DOWNLOAD_PATH=/app/downloads
      - ANOTHERVIEWER_CACHE_PATH=/app/cache
      - ANOTHERVIEWER_CACHE_SIZE_MB=10240
      - ANOTHERVIEWER_DOWNLOAD_WORKER_COUNT=3
      - ANOTHERVIEWER_DB_URL=jdbc:sqlite:/app/data/anotherviewer.db
    restart: unless-stopped
