server:
  port: 8080
  # 部署在 Caddy 反代之后：信任来自 localhost 的 X-Forwarded-For，让 remoteAddr
  # 反映真实客户端 IP（登录限流按 IP 分桶依赖它）。直连部署时该策略同样安全：
  # Tomcat RemoteIpValve 默认只信任内部网段，外部客户端自带的 XFF 不会被采纳。
  forward-headers-strategy: native

spring:
  datasource:
    # 引用 anotherviewer.data-dir，保证 --data-dir / ANOTHERVIEWER_DATA_DIR 两种
    # 注入方式下，数据库与 downloads/cache/security.key 落在同一目录（数据不分家）
    url: jdbc:sqlite:${anotherviewer.data-dir}/anotherviewer.db?journal_mode=WAL&busy_timeout=30000
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

anotherviewer:
  data-dir: ${ANOTHERVIEWER_DATA_DIR:./data}
  download:
    path: ${anotherviewer.data-dir}/downloads
    cache-path: ${anotherviewer.data-dir}/cache
    cache-size-mb: 10240
    worker-count: 3
    download-delay: 0
    download-timeout: 60000
    max-concurrent-galleries: 3
    max-concurrent-images: 3
  reader:
    prefetch-pages: 3
  availability:
    # 探测目标（仅手动 probeNow 使用；默认 EH 根路径）。
    probe-url: https://e-hentai.org
    # 单次探测超时（connect/read 合计；DOWN 期间用户手动恢复只需 ≤ 该值等待）。
    probe-timeout-ms: 12000
  processing:
    concurrency: 1
    task-ttl-ms: 600000
    max-tasks: 100
  smb:
    enabled: false
  security:
    session-timeout: 86400
    encryption-key-path: ${anotherviewer.data-dir}/security.key
    login-max-failures: 5
    login-lockout-ms: 60000
    login-rate-limit-enabled: true
