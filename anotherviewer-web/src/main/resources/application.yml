server:
  port: 8080
  # 部署在 Caddy 反代之后：信任来自 localhost 的 X-Forwarded-For，让 remoteAddr
  # 反映真实客户端 IP（登录限流按 IP 分桶依赖它）。直连部署时该策略同样安全：
  # Tomcat RemoteIpValve 默认只信任内部网段，外部客户端自带的 XFF 不会被采纳。
  forward-headers-strategy: native
  tomcat:
    accesslog:
      # 每请求一行访问日志，落 data-dir/logs（部署机 ProtectSystem=strict 只放行
      # data 可写，日志必须与其他数据同目录）。字段：时间、客户端 IP、请求行、
      # 状态码、响应字节、耗时毫秒（慢请求分析见 docs/deployment.md）。
      enabled: true
      directory: ${anotherviewer.data-dir}/logs
      prefix: access
      file-date-format: .yyyy-MM-dd
      suffix: .log
      max-days: 30
      pattern: '%t %a "%r" %s %B %D'
  # WebUI 静态资产（Vite 产物文件名带 hash）允许激进缓存 + 文本类响应 gzip，
  # 省掉每请求重复下载与明文传输。JSON API 一并压缩（>2KB 才值得）。
  compression:
    enabled: true
    mime-types: text/html, text/css, text/javascript, application/javascript, application/json, image/svg+xml
    min-response-size: 2048

spring:
  datasource:
    # 引用 anotherviewer.data-dir，保证 --data-dir / ANOTHERVIEWER_DATA_DIR 两种
    # 注入方式下，数据库与 downloads/cache/security.key 落在同一目录（数据不分家）
    url: jdbc:sqlite:${anotherviewer.data-dir}/anotherviewer.db?journal_mode=WAL&busy_timeout=30000&synchronous=NORMAL
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  web:
    # 静态资源缓存分级在 WebResourceCacheConfig（P1-3）：/assets/**、/icons/**
    # 365d immutable 强缓存；index.html / sw.js / manifest.json no-cache（发版
    # 即时生效）。这里刻意不再配全局 spring.web.resources.cache.period——全局
    # 365d 会把入口 HTML 一并钉死，老用户需强刷才能看到新版。
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

anotherviewer:
  data-dir: ${ANOTHERVIEWER_DATA_DIR:./data}
  download:
    path: ${anotherviewer.data-dir}/downloads
    cache-path: ${anotherviewer.data-dir}/cache
    cache-size-mb: 10240
    worker-count: 3
    download-delay: 0
    download-timeout: 60000
    max-concurrent-galleries: 3
    max-concurrent-images: 3
  reader:
    prefetch-pages: 3
  availability:
    # 探测目标（仅手动 probeNow 使用；默认 EH 根路径）。
    probe-url: https://e-hentai.org
    # 单次探测超时（connect/read 合计；DOWN 期间用户手动恢复只需 ≤ 该值等待）。
    probe-timeout-ms: 12000
  tier2:
    cache:
      # Tier-2 EH 页面持久缓存（tier2_page 表）容量上限：每轮后台刷新后裁掉
      # fetched_at 最旧的超出行；<=0 = 不裁剪。
      max-entries: 2000
    refresh:
      # 后台刷新 Tier-2 缓存行（Tier2PageService.refreshExpiredEntries，
      # fixedDelay 调度线程）：fetched_at 早于 max-age-ms 的行按最旧优先
      # 重抓，每轮至多 batch-size 条；availability DOWN 时整轮跳过。
      enabled: true
      interval-ms: 1800000
      max-age-ms: 21600000
      batch-size: 10
  processing:
    concurrency: 1
    task-ttl-ms: 600000
    max-tasks: 100
    # 单页业务超时（分钟）：到点 cancel(降级) 后标 FAILED(TIMEOUT)——手册 D15。
    task-timeout-minutes: 30
    automation:
      # 定期补跑扫描心跳（实际触发间隔由 serverConfig periodic_interval_minutes 控制）。
      scan-interval-ms: 60000
  smb:
    enabled: false
  security:
    session-timeout: 86400
    encryption-key-path: ${anotherviewer.data-dir}/security.key
    login-max-failures: 5
    login-lockout-ms: 60000
    login-rate-limit-enabled: true
  integrity:
    # 完整性巡检（StorageIntegrityService）cron：默认每月 1 日 03:00（低峰摊平全库）。
    scrub-cron: "0 0 3 1 * ?"

storage:
  # 存储池形态强制（存储自适配 P4；auto|ssd|hdd|zfs，默认 auto）：探测不可用/结果
  # 不符时可手动指定形态；auto 即按下载目录自然探测。非法值按 auto 处理并 warn。
  profile-override: auto
