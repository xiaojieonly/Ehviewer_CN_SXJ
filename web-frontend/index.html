<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AnotherViewer</title>

    <!-- PWA (roadmap Phase 3.3) -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Initial theme-color; src/stores/theme.ts rewrites this per theme
         (light #009688 / dark #323232 / black #000000) at runtime. -->
    <meta name="theme-color" content="#009688" />

    <!-- iOS / iPadOS "Add to Home Screen" -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AnotherViewer" />
    <!-- 180 = iPhone, 167 = iPad Pro, 152 = iPad, 120 = older iPhone -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
